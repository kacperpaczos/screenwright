Description:
  he: "<p>\u200F\u05E7\u05D1\u05E6\u05D9\u05DD, \u05D9\u05D3\u05D5\u05E2 \u05D2\u05DD\
    \ \u05DB\u05BENautilus, \u05D4\u05D5\u05D0 \u05DE\u05E0\u05D4\u05DC \u05D4\u05E7\
    \u05D1\u05E6\u05D9\u05DD \u05DB\u05D1\u05E8\u05E8\u05EA \u05DE\u05D7\u05D3\u05DC\
    \ \u05E2\u05D1\u05D5\u05E8 \u05E9\u05D5\u05DC\u05D7\u05DF \u05D4\u05E2\u05D1\u05D5\
    \u05D3\u05D4 GNOME. \u05D4\u05D5\u05D0 \u05DE\u05E1\u05E4\u05E7 \u05D3\u05E8\u05DA\
    \ \u05E4\u05E9\u05D5\u05D8\u05D4 \u05D5\u05DE\u05E9\u05D5\u05DC\u05D1\u05EA \u05DC\
    \u05E0\u05D9\u05D4\u05D5\u05DC \u05D4\u05E7\u05D1\u05E6\u05D9\u05DD \u05E9\u05DC\
    \u05DA \u05D5\u05DC\u05E2\u05D9\u05D5\u05DF \u05D1\u05DE\u05E2\u05E8\u05DB\u05EA\
    \ \u05D4\u05E7\u05D1\u05E6\u05D9\u05DD \u05E9\u05DC\u05DA.</p>\n<p>\u200FNautilus\
    \ \u05EA\u05D5\u05DE\u05DA \u05D1\u05DB\u05DC \u05D4\u05E4\u05E2\u05D5\u05DC\u05D5\
    \u05EA \u05D4\u05D1\u05E1\u05D9\u05E1\u05D9\u05D5\u05EA \u05E9\u05DC \u05DE\u05E0\
    \u05D4\u05DC \u05E7\u05D1\u05E6\u05D9\u05DD \u05D5\u05D9\u05D5\u05EA\u05E8. \u05D4\
    \u05D5\u05D0 \u05D9\u05DB\u05D5\u05DC \u05DC\u05D7\u05E4\u05E9 \u05D5\u05DC\u05E0\
    \u05D4\u05DC \u05D0\u05EA \u05D4\u05E7\u05D1\u05E6\u05D9\u05DD \u05D5\u05D4\u05EA\
    \u05D9\u05E7\u05D9\u05D5\u05EA \u05E9\u05DC\u05DA, \u05D4\u05DF \u05D4\u05DE\u05E7\
    \u05D5\u05DE\u05D9\u05D9\u05DD \u05D5\u05D4\u05DF \u05E2\u05DC \u05D4\u05E8\u05E9\
    \u05EA, \u05DC\u05E7\u05E8\u05D5\u05D0 \u05D5\u05DC\u05DB\u05EA\u05D5\u05D1 \u05DE\
    \u05D9\u05D3\u05E2 \u05D0\u05DC \u05D5\u05DE\u05DE\u05D3\u05D9\u05D5\u05EA \u05E0\
    \u05EA\u05D9\u05E7\u05D5\u05EA, \u05DC\u05D4\u05E8\u05D9\u05E5 \u05EA\u05E1\u05E8\
    \u05D9\u05D8\u05D9\u05DD \u05D5\u05DC\u05E9\u05D2\u05E8 \u05D9\u05D9\u05E9\u05D5\
    \u05DE\u05D9\u05DD. \u05D9\u05E9 \u05DC\u05D5 \u05E9\u05DC\u05D5\u05E9 \u05EA\u05E6\
    \u05D5\u05D2\u05D5\u05EA: \u05E8\u05E9\u05EA \u05E1\u05DE\u05DC\u05D9\u05DD, \u05E8\
    \u05E9\u05D9\u05DE\u05EA \u05E1\u05DE\u05DC\u05D9\u05DD \u05D5\u05E8\u05E9\u05D9\
    \u05DE\u05EA \u05E2\u05E5. \u05E0\u05D9\u05EA\u05DF \u05DC\u05D4\u05E8\u05D7\u05D9\
    \u05D1 \u05D0\u05EA \u05D4\u05E4\u05E2\u05D5\u05DC\u05D5\u05EA \u05E9\u05DC\u05D5\
    \ \u05E2\u05DD \u05EA\u05D5\u05E1\u05E4\u05D9\u05DD \u05D5\u05EA\u05E1\u05E8\u05D9\
    \u05D8\u05D9\u05DD.</p>"
  fur: "<p>Files, cognoss\xFBt ancje come Nautilus, al \xE8 il gjest\xF4r di file\
    \ predefin\xEEt dal ambient grafic GNOME. Al furn\xECs une semplice e integrade\
    \ maniere di ministr\xE2 i tiei files e esplor\xE2 il to file-system.</p>\n<p>Nautilus\
    \ al supuarte dutis lis funzions basil\xE2rs di un gjest\xF4r di file e alc di\
    \ plui. Al pues cir\xEE e ministr\xE2 i tiei files e cartelis (in loc\xE2l e suntune\
    \ r\xEAt), lei e scrivi d\xE2ts viers e di disposit\xEEfs estraibii, esegu\xEE\
    \ scripts e f\xE2 part\xEE aplicazions. Al \xE0 tr\xEA viodudis: Gridele di iconis,\
    \ liste di iconis e liste a arbul. Al \xE8 pussibil aument\xE2 lis s\xF4s funzions\
    \ cun plugins e scripts.</p>"
  vi: "<p>T\u1EADp tin, \u0111\u01B0\u1EE3c bi\u1EBFt \u0111\u1EBFn l\xE0 Nautilus,\
    \ l\xE0 \u1EE9ng d\u1EE5ng qu\u1EA3n l\xFD t\u1EADp tin m\u1EB7c \u0111\u1ECB\
    nh cho m\xF4i tr\u01B0\u1EDDng m\xE1y t\xEDnh \u0111\u1EC3 b\xE0n GNOME. N\xF3\
    \ \u0111\u01A1n gi\u1EA3n v\xE0 th\xEDch h\u1EE3p cho qu\u1EA3n l\xFD v\xE0 duy\u1EC7\
    t t\u1EADp tin tr\xEAn h\u1EC7 th\u1ED1ng c\u1EE7a b\u1EA1n.</p>\n<p>Nautilus\
    \ h\u1ED7 tr\u1EE3 m\u1ECDi t\xEDnh n\u0103ng c\u01A1 b\u1EA3n v\u1EC1 qu\u1EA3\
    n l\xFD t\u1EADp tin v\xE0 h\u01A1n th\u1EBF n\u1EEFa. N\xF3 c\xF3 th\u1EC3 t\xEC\
    m ki\u1EBFm v\xE0 qu\u1EA3n l\xFD c\xE1c t\u1EADp tin v\xE0 th\u01B0 m\u1EE5c\
    \ c\u1EE7a b\u1EA1n, c\u1EA3 tr\xEAn m\xE1y n\u1ED9i b\u1ED9 v\xE0 c\u1EA3 tr\xEA\
    n m\u1EA1ng, \u0111\u1ECDc v\xE0 ghi d\u1EEF li\u1EC7u t\u1EEB v\xE0 \u0111\u1EBF\
    n t\u1EEB \u0111\u0129a \u0111a ph\u01B0\u01A1ng ti\u1EC7n, ch\u1EA1y v\u0103\
    n l\u1EC7nh, v\xE0 kh\u1EDFi ch\u1EA1y c\xE1c \u1EE9ng d\u1EE5ng. N\xF3 c\xF3\
    \ ba c\xE1ch tr\xECnh b\xE0y: D\u1EA1ng l\u01B0\u1EDBi bi\u1EC3u t\u01B0\u1EE3\
    ng, Danh s\xE1ch bi\u1EC3u t\u01B0\u1EE3ng, v\xE0 c\xE2y. C\xE1c t\xEDnh n\u0103\
    ng c\u1EE7a n\xF3 c\xF3 th\u1EC3 \u0111\u01B0\u1EE3c m\u1EDF r\u1ED9ng b\u1EB1\
    ng c\xE1c ph\u1EA7n b\u1ED5 xung v\xE0 v\u0103n l\u1EC7nh.</p>"
  eu: '<p>Fitxategiak aplikazioa, Nautilus izenarekin ere ezaguna dena, GNOME mahaigainaren
    fitxategi-kudeatzaile lehenetsia da. Zure fitxategiak kudeatzeko eta baita fitxategi-sistema
    arakatzeko modu bateratua eta xumea eskaintzen du.</p>

    <p>Nautilus aplikazioak fitxategi-kudeatzaile baten oinarrizko funtzioak eta askoz
    gehiago ditu. Zure fitxategiak eta karpetak bilatu eta kudeatu ditzake, bai lokalean
    baita sarean ere. Datuak euskarri aldagarrietatik irakurri eta idatzi ditzake,
    scriptak exekutatu eta aplikazioak abiarazi. Hiru ikuspegi ditu: ikonoen sareta,
    ikonoen zerrenda eta zuhaitzaren zerrenda. Bere gaitasunak hedatu daitezke pluginen
    eta scripten bidez.</p>'
  zh_CN: "<p>\u6587\u4EF6\uFF0C\u53C8\u540D\u201CNautilus\u201D\uFF0C\u662F GNOME\
    \ \u684C\u9762\u73AF\u5883\u7684\u9ED8\u8BA4\u6587\u4EF6\u7BA1\u7406\u5668\u3002\
    \u5B83\u63D0\u4F9B\u7B80\u5355\u96C6\u6210\u7684\u65B9\u5F0F\u6765\u7BA1\u7406\
    \u6587\u4EF6\u548C\u6D4F\u89C8\u6587\u4EF6\u7CFB\u7EDF\u3002</p>\n<p>\u201C\u6587\
    \u4EF6\u201D\u4E0D\u4EC5\u63D0\u4F9B\u6240\u6709\u57FA\u672C\u7684\u6587\u4EF6\
    \u7BA1\u7406\u529F\u80FD\uFF0C\u8FD8\u652F\u6301\u641C\u7D22\u548C\u7BA1\u7406\
    \u672C\u5730\u548C\u8FDC\u7A0B\u7F51\u7EDC\u4E0A\u7684\u6587\u4EF6\u53CA\u6587\
    \u4EF6\u5939\uFF0C\u8BFB\u5199\u53EF\u79FB\u52A8\u5B58\u50A8\u4E0A\u7684\u6570\
    \u636E\uFF0C\u8FD0\u884C\u811A\u672C\u548C\u542F\u52A8\u5E94\u7528\u3002\u5B83\
    \u6709\u4E09\u79CD\u89C6\u56FE\uFF1A\u56FE\u6807\u7F51\u683C\u3001\u56FE\u6807\
    \u5217\u8868\u3001\u6811\u5217\u8868\u3002\u53EF\u4EE5\u7528\u63D2\u4EF6\u548C\
    \u811A\u672C\u6269\u5C55\u5B83\u7684\u529F\u80FD\u3002</p>"
  de: "<p>Dateien, auch bekannt als Nautilus, ist die mitgelieferte Dateiverwaltung\
    \ der GNOME Arbeitsumgebung. Sie bietet eine einfache und ma\xDFgeschneiderte\
    \ Art, Ihre Dateien zu verwalten und Ihr Dateisystem zu durchsuchen.</p>\n<p>Nautilus\
    \ unterst\xFCtzt alle grundlegenden Funktionen einer Dateiverwaltung und mehr.\
    \ Es kann nach lokalen und im Netzwerk gelegenen Dateien und Ordnern suchen und\
    \ diese verwalten, Daten von Wechseldatentr\xE4gern lesen und schreiben, Skripte\
    \ ausf\xFChren und Anwendungen starten. Es bietet drei Ansichten: Objekte im Raster,\
    \ als Liste und die Baumliste. Weitere Funktionen k\xF6nnen Plugins und Skripte\
    \ liefern.</p>"
  pt_BR: "<p>Arquivos, tamb\xE9m conhecido como Nautilus, \xE9 o gerenciador de arquivos\
    \ padr\xE3o do ambiente GNOME. Ele oferece uma maneira simples e integrada de\
    \ gerenciar seus arquivos e de navegar pelo sistema de arquivos.</p>\n<p>O Nautilus\
    \ possui suporte a todas as fun\xE7\xF5es b\xE1sicas de um gerenciador de arquivos\
    \ e muitas mais. Ele pode pesquisar e gerenciar seus arquivos e pastas, tanto\
    \ localmente quanto em uma rede, ler e gravar dados de e para m\xEDdias remov\xED\
    veis, executar scripts e executar aplicativos. O mesmo possui tr\xEAs vis\xF5\
    es: grade de \xEDcones, lista de \xEDcones e lista em \xE1rvore. E as fun\xE7\xF5\
    es dele podem ser estendidas com plug-ins e scripts.</p>"
  be: "<p>\u0424\u0430\u0439\u043B\u044B \u2014 \u043F\u0440\u0430\u0434\u0432\u044B\
    \u0437\u043D\u0430\u0447\u0430\u043D\u044B \u043A\u0456\u0440\u0430\u045E\u043D\
    \u0456\u043A \u0444\u0430\u0439\u043B\u0430\u045E \u0434\u043B\u044F \u0430\u0441\
    \u044F\u0440\u043E\u0434\u0434\u0437\u044F GNOME, \u044F\u043A\u0456 \u0442\u0430\
    \u043A\u0441\u0430\u043C\u0430 \u0432\u044F\u0434\u043E\u043C\u044B \u044F\u043A\
    \ \u041D\u0430\u045E\u0442\u044B\u043B\u0443\u0441. \u0401\u043D \u043F\u0440\u0430\
    \u0434\u0430\u0441\u0442\u0430\u045E\u043B\u044F\u0435 \u043F\u0440\u043E\u0441\
    \u0442\u044B \u0456 \u0437\u0440\u0443\u0447\u043D\u044B \u0441\u043F\u043E\u0441\
    \u0430\u0431 \u043A\u0456\u0440\u0430\u0432\u0430\u043D\u043D\u044F \u0444\u0430\
    \u0439\u043B\u0430\u043C\u0456 \u0456 \u0444\u0430\u0439\u043B\u0430\u0432\u044B\
    \u043C\u0456 \u0441\u0456\u0441\u0442\u044D\u043C\u0430\u043C\u0456.</p>\n<p>\u041D\
    \u0430\u045E\u0442\u044B\u043B\u0443\u0441 \u043F\u0430\u0434\u0442\u0440\u044B\
    \u043C\u043B\u0456\u0432\u0430\u0435 \u045E\u0441\u0435 \u0437\u0432\u044B\u0447\
    \u0430\u0439\u043D\u044B\u044F \u0444\u0443\u043D\u043A\u0446\u044B\u0456 \u043A\
    \u0456\u0440\u0430\u045E\u043D\u0456\u043A\u0430 \u0444\u0430\u0439\u043B\u0430\
    \u045E \u0456 \u0448\u043C\u0430\u0442 \u0456\u043D\u0448\u044B\u0445. \u0401\u043D\
    \ \u043F\u0430\u0434\u0442\u0440\u044B\u043C\u043B\u0456\u0432\u0430\u0435 \u043F\
    \u043E\u0448\u0443\u043A \u0456 \u043A\u0456\u0440\u0430\u0432\u0430\u043D\u043D\
    \u0435 \u0444\u0430\u0439\u043B\u0430\u043C\u0456 \u0456 \u043F\u0430\u043F\u043A\
    \u0430\u043C\u0456, \u044F\u043A \u043B\u0430\u043A\u0430\u043B\u044C\u043D\u044B\
    \u043C\u0456, \u0442\u0430\u043A \u0456 \u0441\u0435\u0442\u043A\u0430\u0432\u044B\
    \u043C\u0456, \u0447\u044B\u0442\u0430\u043D\u043D\u0435 \u0456 \u0437\u0430\u043F\
    \u0456\u0441 \u0434\u0430\u043D\u044B\u0445 \u043D\u0430 \u0437\u0434\u044B\u043C\
    \u043D\u044B\u0445 \u043D\u043E\u0441\u044C\u0431\u0456\u0442\u0430\u0445, \u0437\
    \u0430\u043F\u0443\u0441\u043A \u0437\u0430\u0433\u0430\u0434\u043D\u044B\u0445\
    \ \u0441\u0446\u044D\u043D\u0430\u0440\u044B\u044F\u045E, \u0437\u0430\u043F\u0443\
    \u0441\u043A \u043F\u0440\u0430\u0433\u0440\u0430\u043C. \u041F\u0440\u0430\u0433\
    \u0440\u0430\u043C\u0430 \u043C\u0430\u0435 \u0442\u0440\u044B \u0440\u044D\u0436\
    \u044B\u043C\u0443 \u043F\u0440\u0430\u0446\u044B: \u0443 \u0432\u044B\u0433\u043B\
    \u044F\u0434\u0437\u0435 \u0441\u0435\u0442\u043A\u0456, \u0441\u043F\u0456\u0441\
    \u0430 \u0430\u0431\u043E \u0434\u0440\u044D\u0432\u0430 \u043F\u0430\u043F\u0430\
    \u043A. \u041D\u0430\u045E\u0442\u044B\u043B\u0443\u0441 \u043F\u0430\u0434\u0442\
    \u0440\u044B\u043C\u043B\u0456\u0432\u0430\u0435 \u043F\u0430\u0448\u044B\u0440\
    \u044D\u043D\u043D\u0435 \u044F\u0433\u043E \u0444\u0443\u043D\u043A\u0446\u044B\
    \u0439 \u0437 \u0434\u0430\u043F\u0430\u043C\u043E\u0433\u0430\u0439 \u043F\u043B\
    \u0430\u0433\u0456\u043D\u0430\u045E \u0456 \u0441\u0446\u044D\u043D\u0430\u0440\
    \u044B\u044F\u045E.</p>"
  pt: "<p>O Ficheiros, tamb\xE9m conhecido por Nautilus, \xE9 o gestor de ficheiros\
    \ predefinido do ambiente de trabalho GNOME. Este fornece uma forma simples e\
    \ integrada de gerir os seus ficheiros e de navegar no seu sistema.</p>\n<p>O\
    \ Nautilus suporta todas as fun\xE7\xF5es b\xE1sicas de um gestor de ficheiros\
    \ e mais algumas. Pode procurar e gerir os seus ficheiros e pastas, quer localmente,\
    \ quer numa rede, ler e gravar dados de e para unidades remov\xEDveis, executar\
    \ scripts e iniciar aplica\xE7\xF5es. Tem tr\xEAs vistas: Grelha de \xEDcones,\
    \ Lista de \xEDcones e Lista em \xE1rvore. As suas fun\xE7\xF5es podem sem alargadas\
    \ com plugins e scripts.</p>"
  gl: "<p>Nautilus, tam\xE9n co\xF1ecido como Ficheiros, \xE9 o xestor de ficheiros\
    \ por omisi\xF3n do escritorio GNOME. Fornece unha forma simple e integrada de\
    \ xestionar os seus ficheiros e explorar o seu sistema de ficheiros.</p>\n<p>Nautilus\
    \ admite todas as funci\xF3ns b\xE1sicas de xesti\xF3n de ficheiros e m\xE1is.\
    \ Pode buscar e xestionar todos os seus ficheiros e cartafoles, tanto locais como\
    \ nunha rede, lee e escribe datos nos soportes multimedia, executa scripts e inicia\
    \ aplicaci\xF3ns. Conta con tres vistas: Grella de iconas, Lista de iconas e Lista\
    \ en \xE1rbore. As s\xFAas funci\xF3ns poden estenderse con engadidos e scripts.</p>"
  oc: "<p>Fichi\xE8rs, tanben conegut jol nom de Nautilus, es lo gestionari de fichi\xE8\
    rs per defaut del bur\xE8u GNOME. Ofr\xEDs un mejan simple e integrat de gerir\
    \ v\xF2stres fichi\xE8rs e navigar dins v\xF2stre sist\xE8ma de fichi\xE8rs.</p>\n\
    <p>Nautilus ofr\xEDs totas las foncionalitats basicas e avan\xE7adas d'un gestionari\
    \ de fichi\xE8rs. P\xF2t recercar e gerir v\xF2stres fichi\xE8rs e dorsi\xE8rs,\
    \ locals o sus una ret, legir e escriure de donadas cap a de m\xE8dias amovibles,\
    \ executar d'escripts e d'aplicacions. Presenta tres vistas\u202F: grasilha d'ic\xF2\
    nas, lista d'ic\xF2nas, e lista arborescenta. Sas foncionalitats p\xF2don \xE8\
    sser espandidas amb d'empeutons e d'escripts.</p>"
  fa: "<p>\u067E\u0631\u0648\u0646\u062F\u0647\u200C\u0647\u0627 \u06A9\u0647 \u0628\
    \u0647 \u0646\u0627\u0645 \u0646\u0627\u062A\u06CC\u0644\u0648\u0633 \u0646\u06CC\
    \u0632 \u0634\u0646\u0627\u062E\u062A\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F\
    \u060C \u0645\u062F\u06CC\u0631 \u067E\u0631\u0648\u0646\u062F\u0647\u0654 \u067E\
    \u06CC\u0634\u200C\u06AF\u0632\u06CC\u062F\u0647 \u0645\u06CC\u0632\u06A9\u0627\
    \u0631 \u06AF\u0646\u0648\u0645 \u0627\u0633\u062A. \u0627\u06CC\u0646 \u0628\u0631\
    \u0646\u0627\u0645\u0647 \u0631\u0627\u0647\u06CC \u0633\u0627\u062F\u0647 \u0648\
    \ \u06CC\u06A9\u200C\u067E\u0627\u0631\u0686\u0647 \u0628\u0631\u0627\u06CC \u0645\
    \u062F\u06CC\u0631\u06CC\u062A \u067E\u0631\u0648\u0646\u062F\u0647\u200C\u0647\
    \u0627 \u0648 \u0645\u0631\u0648\u0631 \u0633\u0627\u0645\u0627\u0646\u0647\u200C\
    \u067E\u0631\u0648\u0646\u062F\u0647\u200C\u0647\u0627\u06CC\u062A\u0627\u0646\
    \ \u0641\u0631\u0627\u0647\u0645 \u0645\u06CC\u200C\u06A9\u0646\u062F.</p>\n<p>\u0646\
    \u0627\u062A\u06CC\u0644\u0648\u0633 \u062A\u0645\u0627\u0645 \u0639\u0645\u0644\
    \u06A9\u0631\u062F\u0647\u0627\u06CC \u067E\u0627\u06CC\u0647\u200C\u0627\u06CC\
    \ \u06CC\u06A9 \u0645\u062F\u06CC\u0631 \u067E\u0631\u0648\u0646\u062F\u0647 \u0648\
    \ \u0628\u06CC\u0634\u200C\u062A\u0631 \u0627\u0632 \u0622\u0646 \u0631\u0627\
    \ \u067E\u0634\u062A\u06CC\u0628\u0627\u0646\u06CC \u0645\u06CC\u200C\u06A9\u0646\
    \u062F. \u0627\u06CC\u0646 \u0628\u0631\u0646\u0627\u0645\u0647 \u0645\u06CC\u200C\
    \u062A\u0648\u0627\u0646\u062F \u067E\u0631\u0648\u0646\u062F\u0647\u200C\u0647\
    \u0627 \u0648 \u0634\u0627\u062E\u0647\u200C\u0647\u0627\u06CC\u062A\u0627\u0646\
    \ \u0631\u0627 \u0686\u0647 \u0628\u0647 \u0635\u0648\u0631\u062A \u0645\u062D\
    \u0644\u06CC \u0648 \u0686\u0647 \u0631\u0648\u06CC \u0634\u0628\u06A9\u0647 \u062C\
    \u0633\u062A\u200C\u0648\u062C\u0648 \u0648 \u0645\u062F\u06CC\u0631\u06CC\u062A\
    \ \u06A9\u0646\u062F\u060C \u062F\u0627\u062F\u0647\u200C\u0647\u0627 \u0631\u0627\
    \ \u0627\u0632 \u0631\u0633\u0627\u0646\u0647\u200C\u0647\u0627\u06CC \u0642\u0627\
    \u0628\u0644 \u062D\u0645\u0644 \u062E\u0648\u0627\u0646\u062F\u0647 \u0648 \u0631\
    \u0648\u06CC\u0634\u0627\u0646 \u0628\u0646\u0648\u06CC\u0633\u062F \u0648 \u06A9\
    \u062F\u0646\u0648\u0634\u062A\u0647\u200C\u0647\u0627 \u0648 \u06A9\u0627\u0631\
    \u0647\u200C\u0647\u0627 \u0631\u0627 \u0627\u062C\u0631\u0627 \u06A9\u0646\u062F\
    . \u0627\u06CC\u0646 \u0628\u0631\u0646\u0627\u0645\u0647 \u0633\u0647 \u0646\u0645\
    \u0627 \u062F\u0627\u0631\u062F: \u0634\u0628\u06A9\u0647\u0654 \u0646\u0642\u0634\
    \u06A9\u060C \u0633\u06CC\u0627\u0647\u0647\u0654 \u0646\u0642\u0634\u06A9 \u0648\
    \ \u0633\u06CC\u0627\u0647\u0647\u0654 \u062F\u0631\u062E\u062A\u06CC. \u0639\u0645\
    \u0644\u06A9\u0631\u062F\u0647\u0627\u06CC \u0627\u06CC\u0646 \u0628\u0631\u0646\
    \u0627\u0645\u0647 \u0645\u06CC\u200C\u062A\u0648\u0627\u0646\u062F \u0628\u0647\
    \u200C\u062F\u0633\u062A \u0627\u0641\u0632\u0627\u06CC\u0647\u200C\u0647\u0627\
    \ \u0648 \u06A9\u062F\u0646\u0648\u0634\u062A\u0647\u200C\u0647\u0627 \u06AF\u0633\
    \u062A\u0631\u0634 \u06CC\u0627\u0628\u062F.</p>"
  ru: "<p>\u0424\u0430\u0439\u043B\u044B \u2014 \u0444\u0430\u0439\u043B\u043E\u0432\
    \u044B\u0439 \u043C\u0435\u043D\u0435\u0434\u0436\u0435\u0440 \u043F\u043E \u0443\
    \u043C\u043E\u043B\u0447\u0430\u043D\u0438\u044E \u0434\u043B\u044F \u0440\u0430\
    \u0431\u043E\u0447\u0435\u0433\u043E \u0441\u0442\u043E\u043B\u0430 GNOME, \u0442\
    \u0430\u043A\u0436\u0435 \u0438\u0437\u0432\u0435\u0441\u0442\u043D\u044B\u0439\
    \ \u043A\u0430\u043A \u043F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u0435\
    \ \xABNautilus\xBB. \u041F\u0440\u0435\u0434\u043E\u0441\u0442\u0430\u0432\u043B\
    \u044F\u0435\u0442 \u043F\u0440\u043E\u0441\u0442\u043E\u0439 \u0441\u043F\u043E\
    \u0441\u043E\u0431 \u0434\u043B\u044F \u0443\u043F\u0440\u0430\u0432\u043B\u0435\
    \u043D\u0438\u044F \u0444\u0430\u0439\u043B\u0430\u043C\u0438 \u0438 \u043D\u0430\
    \u0432\u0438\u0433\u0430\u0446\u0438\u0438 \u043F\u043E \u0444\u0430\u0439\u043B\
    \u043E\u0432\u043E\u0439 \u0441\u0438\u0441\u0442\u0435\u043C\u0435.</p>\n<p>Nautilus\
    \ \u043F\u043E\u0434\u0434\u0435\u0440\u0436\u0438\u0432\u0430\u0435\u0442 \u0432\
    \u0441\u0435 \u0431\u0430\u0437\u043E\u0432\u044B\u0435 \u0444\u0443\u043D\u043A\
    \u0446\u0438\u0438 \u0444\u0430\u0439\u043B\u043E\u0432\u044B\u0445 \u043C\u0435\
    \u043D\u0435\u0434\u0436\u0435\u0440\u043E\u0432. \u0421 \u043F\u043E\u043C\u043E\
    \u0449\u044C\u044E Nautilus \u043C\u043E\u0436\u043D\u043E \u0443\u043F\u0440\u0430\
    \u0432\u043B\u044F\u0442\u044C \u0444\u0430\u0439\u043B\u0430\u043C\u0438 \u0438\
    \ \u043F\u0430\u043F\u043A\u0430\u043C\u0438, \u0432\u044B\u043F\u043E\u043B\u043D\
    \u044F\u0442\u044C \u043F\u043E\u0438\u0441\u043A \u0444\u0430\u0439\u043B\u043E\
    \u0432 \u0438 \u043F\u0430\u043F\u043E\u043A \u043A\u0430\u043A \u043B\u043E\u043A\
    \u0430\u043B\u044C\u043D\u043E, \u0442\u0430\u043A \u0438 \u043F\u043E \u0441\u0435\
    \u0442\u0438, \u0447\u0438\u0442\u0430\u0442\u044C \u0438 \u0437\u0430\u043F\u0438\
    \u0441\u044B\u0432\u0430\u0442\u044C \u0434\u0430\u043D\u043D\u044B\u0435 \u043D\
    \u0430 \u0441\u044A\u0451\u043C\u043D\u044B\u0435 \u0443\u0441\u0442\u0440\u043E\
    \u0439\u0441\u0442\u0432\u0430, \u0432\u044B\u043F\u043E\u043B\u043D\u044F\u0442\
    \u044C \u0441\u0446\u0435\u043D\u0430\u0440\u0438\u0438 \u0438 \u0437\u0430\u043F\
    \u0443\u0441\u043A\u0430\u0442\u044C \u043F\u0440\u0438\u043B\u043E\u0436\u0435\
    \u043D\u0438\u044F. Nautilus \u043F\u0440\u0435\u0434\u043B\u0430\u0433\u0430\u0435\
    \u0442 \u0442\u0440\u0438 \u0440\u0435\u0436\u0438\u043C\u0430 \u043F\u0440\u043E\
    \u0441\u043C\u043E\u0442\u0440\u0430: \u0441\u0435\u0442\u043A\u0430 \u0438\u0437\
    \ \u0437\u043D\u0430\u0447\u043A\u043E\u0432, \u0441\u043F\u0438\u0441\u043E\u043A\
    \ \u0438\u0437 \u0437\u043D\u0430\u0447\u043A\u043E\u0432 \u0438 \u0434\u0440\u0435\
    \u0432\u043E\u0432\u0438\u0434\u043D\u044B\u0439 \u0441\u043F\u0438\u0441\u043E\
    \u043A. \u0424\u0443\u043D\u043A\u0446\u0438\u043E\u043D\u0430\u043B\u044C\u043D\
    \u043E\u0441\u0442\u044C Nautilus \u043C\u043E\u0436\u043D\u043E \u0440\u0430\u0441\
    \u0448\u0438\u0440\u044F\u0442\u044C \u0441 \u043F\u043E\u043C\u043E\u0449\u044C\
    \u044E \u043C\u043E\u0434\u0443\u043B\u0435\u0439 \u0438 \u0441\u0446\u0435\u043D\
    \u0430\u0440\u0438\u0435\u0432.</p>"
  el: "<p>\u039F \u039D\u03B1\u03C5\u03C4\u03AF\u03BB\u03BF\u03C2, \u03B3\u03BD\u03C9\
    \u03C3\u03C4\u03CC\u03C2 \u03BA\u03B1\u03B9 \u03C9\u03C2 \u0391\u03C1\u03C7\u03B5\
    \u03AF\u03B1, \u03B5\u03AF\u03BD\u03B1\u03B9 \u03BF \u03C0\u03C1\u03BF\u03B5\u03C0\
    \u03B9\u03BB\u03B5\u03B3\u03BC\u03AD\u03BD\u03BF\u03C2 \u03B4\u03B9\u03B1\u03C7\
    \u03B5\u03B9\u03C1\u03B9\u03C3\u03C4\u03AE\u03C2 \u03B1\u03C1\u03C7\u03B5\u03AF\
    \u03C9\u03BD \u03C4\u03BF\u03C5 GNOME. \u03A0\u03C1\u03BF\u03C3\u03C6\u03AD\u03C1\
    \u03B5\u03B9 \u03AD\u03BD\u03B1\u03BD \u03B1\u03C0\u03BB\u03CC \u03BA\u03B1\u03B9\
    \ \u03BF\u03BB\u03BF\u03BA\u03BB\u03B7\u03C1\u03C9\u03BC\u03AD\u03BD\u03BF \u03C4\
    \u03C1\u03CC\u03C0\u03BF \u03B4\u03B9\u03B1\u03C7\u03B5\u03AF\u03C1\u03B9\u03C3\
    \u03B7\u03C2 \u03C4\u03C9\u03BD \u03B1\u03C1\u03C7\u03B5\u03AF\u03C9\u03BD \u03BA\
    \u03B1\u03B9 \u03C0\u03B5\u03C1\u03B9\u03AE\u03B3\u03B7\u03C3\u03B7\u03C2 \u03C4\
    \u03BF\u03C5 \u03C3\u03C5\u03C3\u03C4\u03AE\u03BC\u03B1\u03C4\u03BF\u03C2 \u03B1\
    \u03C1\u03C7\u03B5\u03AF\u03C9\u03BD.</p>\n<p>\u039F \u039D\u03B1\u03C5\u03C4\u03AF\
    \u03BB\u03BF\u03C2 \u03C5\u03C0\u03BF\u03C3\u03C4\u03B7\u03C1\u03AF\u03B6\u03B5\
    \u03B9 \u03CC\u03BB\u03B5\u03C2 \u03C4\u03B9\u03C2 \u03B2\u03B1\u03C3\u03B9\u03BA\
    \u03AD\u03C2 \u03BB\u03B5\u03B9\u03C4\u03BF\u03C5\u03C1\u03B3\u03AF\u03B5\u03C2\
    \ \u03B5\u03BD\u03CC\u03C2 \u03B4\u03B9\u03B1\u03C7\u03B5\u03B9\u03C1\u03B9\u03C3\
    \u03C4\u03AE \u03B1\u03C1\u03C7\u03B5\u03AF\u03C9\u03BD. \u039C\u03C0\u03BF\u03C1\
    \u03B5\u03AF \u03BD\u03B1 \u03B1\u03BD\u03B1\u03B6\u03B7\u03C4\u03AE\u03C3\u03B5\
    \u03B9 \u03BA\u03B1\u03B9 \u03BD\u03B1 \u03B4\u03B9\u03B1\u03C7\u03B5\u03B9\u03C1\
    \u03B9\u03C3\u03C4\u03B5\u03AF \u03C4\u03B1 \u03B1\u03C1\u03C7\u03B5\u03AF\u03B1\
    \ \u03BA\u03B1\u03B9 \u03C4\u03BF\u03C5\u03C2 \u03C6\u03B1\u03BA\u03AD\u03BB\u03BF\
    \u03C5\u03C2 \u03C3\u03B1\u03C2, \u03C4\u03CC\u03C3\u03BF \u03C4\u03BF\u03C0\u03B9\
    \u03BA\u03AC \u03CC\u03C3\u03B1 \u03BA\u03B1\u03B9 \u03BC\u03AD\u03C3\u03C9 \u03C4\
    \u03BF\u03C5 \u03B4\u03B9\u03BA\u03C4\u03CD\u03BF\u03C5, \u03BD\u03B1 \u03B4\u03B9\
    \u03B1\u03B2\u03AC\u03C3\u03B5\u03B9 \u03BA\u03B1\u03B9 \u03BD\u03B1 \u03B3\u03C1\
    \u03AC\u03C8\u03B5\u03B9 \u03B4\u03B5\u03B4\u03BF\u03BC\u03AD\u03BD\u03B1 \u03B1\
    \u03C0\u03CC \u03B1\u03C6\u03B1\u03B9\u03C1\u03BF\u03CD\u03BC\u03B5\u03BD\u03B5\
    \u03C2 \u03C3\u03C5\u03C3\u03BA\u03B5\u03C5\u03AD\u03C2, \u03BD\u03B1 \u03B5\u03BA\
    \u03C4\u03B5\u03BB\u03AD\u03C3\u03B5\u03B9 \u03C3\u03B5\u03BD\u03AC\u03C1\u03B9\
    \u03B1 \u03B5\u03BD\u03B5\u03C1\u03B3\u03B5\u03B9\u03CE\u03BD, \u03BA\u03B1\u03B9\
    \ \u03BD\u03B1 \u03B5\u03BA\u03BA\u03B9\u03BD\u03AE\u03C3\u03B5\u03B9 \u03B5\u03C6\
    \u03B1\u03C1\u03BC\u03BF\u03B3\u03AD\u03C2. \u0388\u03C7\u03B5\u03B9 \u03C4\u03C1\
    \u03B5\u03B9\u03C2 \u03C0\u03C1\u03BF\u03B2\u03BF\u03BB\u03AD\u03C2: \u03A0\u03BB\
    \u03AD\u03B3\u03BC\u03B1 \u03B5\u03B9\u03BA\u03BF\u03BD\u03B9\u03B4\u03AF\u03C9\
    \u03BD, \u039B\u03AF\u03C3\u03C4\u03B1 \u03B5\u03B9\u03BA\u03BF\u03BD\u03B9\u03B4\
    \u03AF\u03C9\u03BD \u03BA\u03B1\u03B9 \u0394\u03B5\u03BD\u03B4\u03C1\u03B9\u03BA\
    \u03AE \u03BB\u03AF\u03C3\u03C4\u03B1. \u039F\u03B9 \u03BB\u03B5\u03B9\u03C4\u03BF\
    \u03C5\u03C1\u03B3\u03AF\u03B5\u03C2 \u03C4\u03BF\u03C5 \u03BC\u03C0\u03BF\u03C1\
    \u03BF\u03CD\u03BD \u03BD\u03B1 \u03B5\u03C0\u03B5\u03BA\u03C4\u03B1\u03B8\u03BF\
    \u03CD\u03BD \u03BC\u03B5 \u03C0\u03C1\u03CC\u03C3\u03B8\u03B5\u03C4\u03B1 \u03BA\
    \u03B1\u03B9 \u03C3\u03B5\u03BD\u03AC\u03C1\u03B9\u03B1 \u03B5\u03BD\u03B5\u03C1\
    \u03B3\u03B5\u03B9\u03CE\u03BD.</p>"
  uk: "<p>\u0424\u0430\u0439\u043B\u0438, \u0442\u0430\u043A\u043E\u0436 \u0432\u0456\
    \u0434\u043E\u043C\u0456 \u044F\u043A Nautilus, \u2014 \u0442\u0438\u043F\u043E\
    \u0432\u0438\u0439 \u0444\u0430\u0439\u043B\u043E\u0432\u0438\u0439 \u043C\u0435\
    \u043D\u0435\u0434\u0436\u0435\u0440 \u0434\u043B\u044F \u0441\u0442\u0456\u043B\
    \u044C\u043D\u0438\u0447\u043D\u043E\u0433\u043E \u0441\u0435\u0440\u0435\u0434\
    \u043E\u0432\u0438\u0449\u0430 GNOME. \u0412\u0456\u043D \u0434\u043E\u0437\u0432\
    \u043E\u043B\u044F\u0454 \u043F\u0440\u043E\u0441\u0442\u0438\u0439 \u0442\u0430\
    \ \u0456\u043D\u0442\u0435\u0433\u0440\u043E\u0432\u0430\u043D\u0438\u0439 \u0441\
    \u043F\u043E\u0441\u0456\u0431 \u0443\u043F\u043E\u0440\u044F\u0434\u043A\u0443\
    \u0432\u0430\u043D\u043D\u044F \u0432\u0430\u0448\u0438\u0445 \u0444\u0430\u0439\
    \u043B\u0456\u0432 \u0456 \u043F\u0435\u0440\u0435\u0433\u043B\u044F\u0434\u0430\
    \u043D\u043D\u044F \u0444\u0430\u0439\u043B\u043E\u0432\u043E\u0457 \u0441\u0438\
    \u0441\u0442\u0435\u043C\u0438.</p>\n<p>Nautilus \u043F\u0456\u0434\u0442\u0440\
    \u0438\u043C\u0443\u0454 \u0432\u0441\u0456 \u0431\u0430\u0437\u043E\u0432\u0456\
    \ \u043C\u043E\u0436\u043B\u0438\u0432\u043E\u0441\u0442\u0456 \u0444\u0430\u0439\
    \u043B\u043E\u0432\u043E\u0433\u043E \u043C\u0435\u043D\u0435\u0434\u0436\u0435\
    \u0440\u0430 \u0456 \u043D\u0430\u0432\u0456\u0442\u044C \u0431\u0456\u043B\u044C\
    \u0448\u0435. \u0412\u0456\u043D \u043C\u043E\u0436\u0435 \u0448\u0443\u043A\u0430\
    \u0442\u0438 \u0456 \u0432\u043F\u043E\u0440\u044F\u0434\u043A\u043E\u0432\u0443\
    \u0432\u0430\u0442\u0438 \u0432\u0430\u0448\u0456 \u0444\u0430\u0439\u043B\u0438\
    \ \u0456 \u0442\u0435\u043A\u0438 \u044F\u043A \u043B\u043E\u043A\u0430\u043B\u044C\
    \u043D\u043E, \u0442\u0430\u043A \u0456 \u0432 \u043C\u0435\u0440\u0435\u0436\u0456\
    , \u0447\u0438\u0442\u0430\u0442\u0438 \u0456 \u0437\u0430\u043F\u0438\u0441\u0443\
    \u0432\u0430\u0442\u0438 \u0434\u0430\u043D\u0456 \u0447\u0435\u0440\u0435\u0437\
    \ \u0437\u043C\u0456\u043D\u043D\u0438\u0439 \u043D\u043E\u0441\u0456\u0439, \u0437\
    \u0430\u043F\u0443\u0441\u043A\u0430\u0442\u0438 \u0441\u043A\u0440\u0438\u043F\
    \u0442\u0438 \u0456 \u0437\u0430\u043F\u0443\u0441\u043A\u0430\u0442\u0438 \u043F\
    \u0440\u043E\u0433\u0440\u0430\u043C\u0438. \u0412\u0456\u043D \u043C\u0430\u0454\
    \ \u0442\u0440\u0438 \u0440\u0435\u0436\u0438\u043C\u0438 \u043F\u0435\u0440\u0435\
    \u0433\u043B\u044F\u0434\u0443: \u0491\u0440\u0430\u0442\u043A\u0438 \u043F\u0456\
    \u043A\u0442\u043E\u0433\u0440\u0430\u043C, \u0441\u043F\u0438\u0441\u043E\u043A\
    \ \u043F\u0456\u043A\u0442\u043E\u0433\u0440\u0430\u043C, \u0456\u0454\u0440\u0430\
    \u0440\u0445\u0456\u0447\u043D\u0438\u0439 \u0441\u043F\u0438\u0441\u043E\u043A\
    . \u041C\u043E\u0436\u043B\u0438\u0432\u043E\u0441\u0442\u0456 \u043C\u043E\u0436\
    \u043D\u0430 \u0440\u043E\u0437\u0448\u0438\u0440\u0438\u0442\u0438 \u0437\u0430\
    \ \u0434\u043E\u043F\u043E\u043C\u043E\u0433\u043E\u044E \u0434\u043E\u0434\u0430\
    \u0442\u043A\u0456\u0432 \u0456 \u0441\u043A\u0440\u0438\u043F\u0442\u0456\u0432\
    .</p>"
  fr: "<p>Fichiers, \xE9galement connu sous le nom de Nautilus, est le gestionnaire\
    \ de fichiers par d\xE9faut du bureau GNOME. Il offre un moyen simple et int\xE9\
    gr\xE9 de g\xE9rer vos fichiers et naviguer dans votre syst\xE8me de fichiers.</p>\n\
    <p>Nautilus offre toutes les fonctionnalit\xE9s basiques et avanc\xE9es d\u2019\
    un gestionnaire de fichiers. Il peut rechercher et g\xE9rer vos fichiers et dossiers,\
    \ locaux ou sur un r\xE9seau, lire et \xE9crire des donn\xE9es vers des m\xE9\
    dias amovibles, ex\xE9cuter des scripts et des applications. Il pr\xE9sente trois\
    \ vues\_: grille d\u2019ic\xF4nes, liste d\u2019ic\xF4nes, et liste arborescente.\
    \ Ses fonctionnalit\xE9s peuvent \xEAtre \xE9tendues avec des greffons et des\
    \ scripts.</p>"
  is: "<p>Skr\xE1astj\xF3ri, einnig \xFEekktur sem Nautilusi, er sj\xE1lfgefinn skr\xE1\
    astj\xF3ri GNOME skj\xE1bor\xF0sumhverfisins. \xDEetta er einf\xF6ld og samtvinnu\xF0\
    \ lei\xF0 til a\xF0 s\xFDsla me\xF0 skr\xE1r og til a\xF0 vafra um \xE1 skr\xE1\
    akerfinu.</p>\n<p>Nautilus sty\xF0ur allar helstu a\xF0ger\xF0ir vi\xF0 ums\xFD\
    slu skr\xE1a, og fleira til. Hann getur leita\xF0 a\xF0 og me\xF0h\xF6ndla\xF0\
    \ skr\xE1r og m\xF6ppur, b\xE6\xF0i \xE1 t\xF6lvunni sj\xE1lfri sem og \xE1 netkerfum.\
    \ Hann getur lesi\xF0 og skrifa\xF0 g\xF6gn \xE1 \xFAtskiptanlegum gagnami\xF0\
    lum, keyrt skriftur og keyrt forrit. Hann er me\xF0 \xFErenns konar \xE1s\xFD\
    nd: uppra\xF0a\xF0ar t\xE1knmyndir, t\xE1knmyndir \xED lista og greinalistas\xFD\
    n. H\xE6gt er a\xF0 b\xE6ta vi\xF0 eiginleika me\xF0 hj\xE1lparforritum (plugins)\
    \ og me\xF0 skriftum.</p>"
  da: "<p>Programmet Filer, ogs\xE5 kendt som Nautilus, er standardfilh\xE5ndteringen\
    \ for GNOME-skrivebordet. Nautilus tilbyder en simpel og integreret m\xE5de at\
    \ gennemse filsystemet p\xE5 og filh\xE5ndtering generelt.</p>\n<p>Nautilus underst\xF8\
    tter alle de grundl\xE6ggende funktioner til filh\xE5ndtering med mere. Programmet\
    \ kan s\xF8ge blandt og h\xE5ndtere dine filer og mapper b\xE5de lokalt og p\xE5\
    \ et netv\xE6rk, l\xE6se og skrive data til og fra flytbare medier, k\xF8re scripter\
    \ samt starte programmer. Det har tre visningsformer: ikongitter, ikonliste og\
    \ tr\xE6liste. Dets funktioner kan udvides med moduler og scripter.</p>"
  lt: "<p>Failai, dar \u017Einoma kaip Nautilus, yra numatytoji GNOME darbalaukio\
    \ fail\u0173 tvarkytuv\u0117. Ji suteikia paprast\u0105 ir integruot\u0105 b\u016B\
    d\u0105 fail\u0173 tvarkymui ir fail\u0173 sistemos nar\u0161ymui.</p>\n<p>Nautilus\
    \ palaiko visas pagrindines fail\u0173 tvarkytuv\u0117s funkcijas ir daugiau.\
    \ Galima ie\u0161koti bei tvarkyti failus ir aplankus, tiek vietoje, tiek tinkle,\
    \ skaityti ir ra\u0161yti duomenis \u012F i\u0161imamas laikmenas, vykdyti scenarijus\
    \ bei paleisti programas. Yra trys rodiniai: piktogram\u0173 tinklelis, piktogram\u0173\
    \ s\u0105ra\u0161as bei med\u017Eio s\u0105ra\u0161as. Funkcijas galima prapl\u0117\
    sti \u012Fskiepiais ir scenarijais.</p>"
  sv: "<p>Filer, ocks\xE5 k\xE4nd som Nautilus, \xE4r standardfilhanteraren f\xF6\
    r GNOME-skrivbordet. Den tillhandah\xE5ller ett enkelt och integrerat s\xE4tt\
    \ att hantera dina filer samt bl\xE4ddra i ditt filsystem.</p>\n<p>Nautilus st\xF6\
    der en filhanterares alla grundl\xE4ggande funktioner och mer d\xE4rtill. Den\
    \ kan s\xF6ka och hantera din filer och mappar, b\xE5de lokalt och p\xE5 ett n\xE4\
    tverk, l\xE4sa och skapa data till och fr\xE5n utbytbar media, k\xF6ra skript,\
    \ och starta program. Den har tre vyer: Ikonrutn\xE4t, ikonlista, och tr\xE4dlista.\
    \ Dess funktioner kan ut\xF6kas med insticksmoduler och skript.</p>"
  sk: "<p>Aplik\xE1cia S\xFAbory, tie\u017E zn\xE1ma ako Nautilus, je predvolen\xFD\
    \ spr\xE1vca s\xFAborov prostredia GNOME. Poskytuje jednoduch\xFD a integrovan\xFD\
    \ sp\xF4sob spravovania va\u0161ich s\xFAborov a prehliadania v\xE1\u0161ho syst\xE9\
    mu s\xFAborov.</p>\n<p>Program Nautilus podporuje v\u0161etky z\xE1kladn\xE9 funkcie\
    \ spr\xE1vcu s\xFAborov a e\u0161te viac. Dok\xE1\u017Ee vyh\u013Eada\u0165 a\
    \ spravova\u0165 va\u0161e s\xFAbory a prie\u010Dinky, miestne aj v sieti, \u010D\
    \xEDta\u0165 a zap\xEDsa\u0165 \xFAdaje na vymenite\u013En\xFDch m\xE9di\xE1ch,\
    \ spusti\u0165 skripty a aplik\xE1cie. Obsahuje tri druhy zobrazen\xED: Mrie\u017E\
    ka ik\xF4n, zoznam ik\xF4n a stromov\xE9 zobrazenie. Jeho funkcie m\xF4\u017E\
    u by\u0165 roz\u0161\xEDren\xE9 pomocou z\xE1suvn\xFDch modulov a skriptov.</p>"
  ca: "<p>El Fitxers, tamb\xE9 conegut com el Nautilus, \xE9s el gestor de fitxers\
    \ per defecte de l'escriptori GNOME. Permet, d'una forma simple i integrada, la\
    \ gesti\xF3 de fitxers i la navegaci\xF3 pel sistema de fitxers.</p>\n<p>El Nautilus\
    \ permet realitzar totes les funcions b\xE0siques d'un gestor de fitxers i molt\
    \ m\xE9s. Pot cercar i gestionar els vostres fitxers i carpetes, tan locals com\
    \ a la xarxa; llegir i escriure dades des de i cap a un medi extra\xEFble; executar\
    \ scripts i iniciar aplicacions. T\xE9 tres visualitzacions: graella d'icones,\
    \ llista d'icones i llista d'arbre. Es poden ampliar les seves funcions mitjan\xE7\
    ant connectors i scripts.</p>"
  C: "<p>\n      Files, also known as Nautilus, is the default file manager of the\
    \ GNOME desktop.\n      It provides a  simple and integrated way of managing your\
    \ files and browsing your file system.\n    </p>\n<p>\n      Nautilus supports\
    \ all the basic functions of a file manager and more.\n      It can search and\
    \ manage your files and folders, both locally and on a network,\n      read and\
    \ write data to and from removable media, run scripts, and launch apps.\n    \
    \  It has three views: Icon Grid, Icon List, and Tree List.\n      Its functions\
    \ can be extended with plugins and scripts.\n    </p>"
  bg: "<p>\u201E\u0424\u0430\u0439\u043B\u043E\u0432\u0435\u201C, \u0438\u0437\u0432\
