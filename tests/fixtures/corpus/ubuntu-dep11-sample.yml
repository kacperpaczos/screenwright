    \u0441\u043D\u043E \u0434\u0430 \u043F\u0440\u043E\u0432\u0435\u0440\u044F\u0432\
    \u0430\u0442\u0435, \u0444\u043E\u0440\u043C\u0430\u0442\u0438\u0440\u0430\u0442\
    \u0435, \u043F\u043E\u0434\u0435\u043B\u044F\u0442\u0435 \u0438 \u043D\u0430\u0441\
    \u0442\u0440\u043E\u0439\u0432\u0430\u0442\u0435 \u0434\u0438\u0441\u043A\u043E\
    \u0432\u0435 \u0438 \u0434\u0440\u0443\u0433\u0438 \u0431\u043B\u043E\u043A\u043E\
    \u0432\u0438 \u0443\u0441\u0442\u0440\u043E\u0439\u0441\u0442\u0432\u0430.</p>\n\
    <p>\u0427\u0440\u0435\u0437 \u201E\u0414\u0438\u0441\u043A\u043E\u0432\u0435 \u043D\
    \u0430 GNOME\u201C \u043C\u043E\u0436\u0435 \u0434\u0430 \u043F\u0440\u0435\u0433\
    \u043B\u0435\u0436\u0434\u0430\u0442\u0435 \u0434\u0430\u043D\u043D\u0438\u0442\
    \u0435 \u043E\u0442 \u0441\u0430\u043C\u043E\u0434\u0438\u0430\u0433\u043D\u043E\
    \u0441\u0442\u0438\u043A\u0430\u0442\u0430 (SMART), \u0434\u0430 \u0443\u043F\u0440\
    \u0430\u0432\u043B\u044F\u0432\u0430\u0442\u0435 \u0438 \u0434\u0430 \u0442\u0435\
    \u0441\u0442\u0432\u0430\u0442\u0435 \u043F\u0440\u043E\u0438\u0437\u0432\u043E\
    \u0434\u0438\u0442\u0435\u043B\u043D\u043E\u0441\u0442\u0442\u0430 \u043D\u0430\
    \ \u0443\u0441\u0442\u0440\u043E\u0439\u0441\u0442\u0432\u0430, \u043A\u0430\u043A\
    \u0442\u043E \u0438 \u0434\u0430 \u0437\u0430\u043F\u0438\u0441\u0432\u0430\u0442\
    \u0435 \u0438\u0437\u043E\u0431\u0440\u0430\u0436\u0435\u043D\u0438\u0435 \u0432\
    \u044A\u0440\u0445\u0443 USB \u043F\u0430\u043C\u0435\u0442.</p>"
  it: "<p>Dischi fornisce uno strumento semplice per ispezionare, formattare, partizionare\
    \ e configurare dischi e dispositivi a blocchi.</p>\n<p>Utilizzando Dischi \xE8\
    \ possibile visualizzare i dati SMART, gestire dispositivi RAID, eseguire benchmark\
    \ su dischi fisici e scrivere immagini su dispositivi USB.</p>"
  es: "<p>Discos proporciona una manera sencilla de inspeccionar, formatear, particionar\
    \ y configurar discos y dispositivos de bloques.</p>\n<p>Usando Discos puede ver\
    \ los datos SMART, gestionar dispositivos, realizar pruebas de rendimiento a los\
    \ discos y crear im\xE1genes de dispositivos USB.</p>"
  ko: "<p>\uB514\uC2A4\uD06C\uB97C \uC0AC\uC6A9\uD574 \uB514\uC2A4\uD06C \uBC0F \uBE14\
    \uB85D \uC7A5\uCE58\uB97C \uC0B4\uD3B4\uBCF4\uACE0, \uD3EC\uB9F7\uD558\uACE0,\
    \ \uD30C\uD2F0\uC158\uC744 \uB098\uB204\uACE0, \uC124\uC815\uD558\uB294 \uC77C\
    \uC744 \uC27D\uAC8C \uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4.</p>\n<p>\uB514\uC2A4\
    \uD06C\uB97C \uC0AC\uC6A9\uD574 \uC2A4\uB9C8\uD2B8(SMART) \uB370\uC774\uD130\uB97C\
    \ \uBCF4\uACE0, RAID \uC7A5\uCE58\uB97C \uAD00\uB9AC\uD558\uACE0, \uBB3C\uB9AC\
    \uC801 \uB514\uC2A4\uD06C\uB97C \uBCA4\uCE58\uB9C8\uD06C\uD558\uACE0, USB \uBA54\
    \uBAA8\uB9AC \uC774\uBBF8\uC9C0\uB97C \uB9CC\uB4E4 \uC218 \uC788\uC2B5\uB2C8\uB2E4\
    . \uC0AC\uC6A9\uC790\uAC00 \uD504\uB85C\uADF8\uB7A8\uC744 \uB2EB\uB354\uB77C\uB3C4\
    \ \uD544\uC694\uD55C \uC791\uC5C5\uC744 \uBC31\uADF8\uB77C\uC6B4\uB4DC\uC5D0\uC11C\
    \ \uC2E4\uD589\uD569\uB2C8\uB2E4.</p>"
  ne: "<p>\u0921\u093F\u0938\u094D\u0915\u0928\u093F\u0930\u0940\u0915\u094D\u0937\
    \u0923, \u0922\u093E\u0901\u091A\u093E, \u0935\u093F\u092D\u093E\u091C\u0928,\
    \ \u0930 \u0921\u093F\u0938\u094D\u0915 \u0930 \u092C\u094D\u0932\u0915 \u0909\
    \u092A\u0915\u0930\u0923\u0939\u0930\u0942 \u0915\u0928\u094D\u092B\u093F\u0917\
    \u0930 \u0917\u0930\u094D\u0928 \u090F\u0915 \u0938\u091C\u093F\u0932\u094B \u0924\
    \u0930\u093F\u0915\u093E \u092A\u094D\u0930\u0926\u093E\u0928 \u0917\u0930\u094D\
    \u0926\u091B\u0964</p>\n<p>\u0921\u093F\u0938\u094D\u0915\u0939\u0930\u0942 \u092A\
    \u094D\u0930\u092F\u094B\u0917 \u0917\u0930\u0947\u0930, \u0924\u092A\u093E\u0908\
    \u0902 SMART \u0921\u0947\u091F\u093E \u0939\u0947\u0930\u094D\u0928 \u0938\u0915\
    \u094D\u0928\u0941\u0939\u0941\u0928\u094D\u091B, \u0909\u092A\u0915\u0930\u0923\
    \u0939\u0930\u0942 \u0935\u094D\u092F\u0935\u0938\u094D\u0925\u093E\u092A\u0928\
    \ \u0917\u0930\u094D\u0928 \u0938\u0915\u094D\u0928\u0941\u0939\u0941\u0928\u094D\
    \u091B, \u092E\u093E\u0928\u0915 \u092D\u094C\u0924\u093F\u0915 \u0921\u093F\u0938\
    \u094D\u0915\u0939\u0930\u0942, \u0930 \u091B\u0935\u093F USB \u0938\u094D\u091F\
    \u093F\u0915\u0939\u0930\u0942\u0964</p>"
  sl: "<p>Program omogo\u010Da enostaven nadzor in upravljanje z diski, formatiranje,\
    \ razdeljevanje in nastavljanje vseh blo\u010Dnih naprav.</p>\n<p>Uporaba programa\
    \ Disks omogo\u010Da pregled podatkov SMART, upravljanje naprav, izvajanje testiranj\
    \ diskov in klju\u010Dkov USB.</p>"
  en_GB: '<p>Disks provides an easy way to inspect, format, partition, and configure
    disks and block devices.</p>

    <p>Using Disks, you can view SMART data, manage devices, benchmark physical disks,
    and image USB sticks.</p>'
  cs: "<p>Aplikace Disky poskytuje snadn\xFD zp\u016Fsob, jak kontrolovat, form\xE1\
    tovat, rozd\u011Blovat a nastavovat disky a blokov\xE1 za\u0159\xEDzen\xED.</p>\n\
    <p>Pomoc\xED Disk\u016F si m\u016F\u017Eete prohl\xED\u017Eet data SMART, spravovat\
    \ za\u0159\xEDzen\xED, prov\xE1d\u011Bt srovn\xE1vac\xED testy disk\u016F a zobrazovat\
    \ flashdisky USB.</p>"
  id: '<p>Diska memberikan cara yang mudah untuk memeriksa, format, partisi dan mengatur
    diska dan blok perangkat.</p>

    <p>Dengan Diska, Anda bisa melihat data SMART, mengelola perangkat, menguji fisik
    diska, dan stik USB.</p>'
  tr: "<p>Diskler; diskleri ve blok ayg\u0131tlar\u0131 denetlemek, bi\xE7imlendirmek,\
    \ b\xF6l\xFCmlendirmek ve yap\u0131land\u0131rmak i\xE7in kolay bir yol sa\u011F\
    lar.</p>\n<p>Diskler\u2019i kullanarak; SMART verisini g\xF6rebilir, ayg\u0131\
    tlar\u0131 y\xF6netebilir, fiziksel diskleri de\u011Ferlendirebilir, USB bellekleri\
    \ kopyalayabilirsiniz.</p>"
  sr: "<p>\u0414\u0438\u0441\u043A\u043E\u0432\u0438 \u0432\u0430\u043C \u043F\u0440\
    \u0443\u0436\u0430\u0458\u0443 \u043B\u0430\u043A \u043D\u0430\u0447\u0438\u043D\
    \ \u0437\u0430 \u043F\u0440\u043E\u0432\u0435\u0440\u0443, \u0444\u043E\u0440\u043C\
    \u0430\u0442\u0438\u0440\u0430\u045A\u0435, \u043F\u0430\u0440\u0442\u0438\u0446\
    \u0438\u043E\u043D\u0438\u0441\u0430\u045A\u0435 \u0438 \u043F\u043E\u0434\u0435\
    \u0448\u0430\u0432\u0430\u045A\u0435 \u0434\u0438\u0441\u043A\u043E\u0432\u0430\
    \ \u0438 \u0431\u043B\u043E\u043A \u0443\u0440\u0435\u0452\u0430\u0458\u0430.</p>\n\
    <p>\u041A\u043E\u0440\u0438\u0448\u045B\u0435\u045A\u0435\u043C \u0414\u0438\u0441\
    \u043A\u043E\u0432\u0430 \u043C\u043E\u0436\u0435\u0442\u0435 \u0432\u0438\u0434\
    \u0435\u0442\u0438 \u0421\u041C\u0410\u0420\u0422 \u043F\u043E\u0434\u0430\u0442\
    \u043A\u0435, \u0443\u043F\u0440\u0430\u0432\u0459\u0430\u0442\u0438 \u0443\u0440\
    \u0435\u0452\u0430\u0458\u0438\u043C\u0430, \u043C\u0435\u0440\u0438\u0442\u0438\
    \ \u043E\u0434\u043B\u0438\u043A\u0435 \u0444\u0438\u0437\u0438\u0447\u043A\u0438\
    \u0445 \u0434\u0438\u0441\u043A\u043E\u0432\u0430 \u0438 \u043F\u0440\u0430\u0432\
    \u0438\u0442\u0438 \u043E\u0434\u0440\u0430\u0437\u0435 \u0423\u0421\u0411 \u0448\
    \u0442\u0430\u043F\u0438\u045B\u0430.</p>"
  fi: "<p>Levyt tarjoaa helpon tavatan tutkia, alustaa, osioida ja m\xE4\xE4ritt\xE4\
    \xE4 levyjen sek\xE4 lohkolaitteiden asetuksia.</p>\n<p>Levysovelluksella voit\
    \ tarkkailla SMART-tietoja, hallita laitteita, mitata suorituskykytestej\xE4 ja\
    \ luoda esimerkiksi USB-muistitikkuja levykuvista.</p>"
  pl: "<p>Program Dyski dostarcza \u0142atwy spos\xF3b na badanie, formatowanie, partycjonowanie\
    \ i\_konfigurowanie dysk\xF3w oraz urz\u0105dze\u0144 blokowych.</p>\n<p>Za pomoc\u0105\
    \ programu Dyski mo\u017Cna wy\u015Bwietla\u0107 dane SMART, zarz\u0105dza\u0107\
    \ urz\u0105dzeniami, testowa\u0107 wydajno\u015B\u0107 fizycznych dysk\xF3w i\_\
    nagrywa\u0107 obrazy na dyski USB.</p>"
  hu: "<p>A Lemezek egyszer\u0171 m\xF3don biztos\xEDtja a lemezek \xE9s blokkeszk\xF6\
    z\xF6k vizsg\xE1lat\xE1t, form\xE1z\xE1s\xE1t, particion\xE1l\xE1s\xE1t \xE9s\
    \ be\xE1ll\xEDt\xE1s\xE1t.</p>\n<p>A Lemezek haszn\xE1lat\xE1val megtekintheti\
    \ a SMART adatokat, kezelheti az eszk\xF6z\xF6ket, teljes\xEDtm\xE9nytesztet hajthat\
    \ v\xE9gre fizikai lemezeken, valamint lemezk\xE9pet k\xE9sz\xEDthet USB-meghajt\xF3\
    kr\xF3l.</p>"
  pa: "<p>\u0A21\u0A3F\u0A38\u0A15 \u0A05\u0A24\u0A47 \u0A2C\u0A32\u0A3E\u0A15 \u0A21\
    \u0A3F\u0A35\u0A3E\u0A08\u0A38\u0A3E\u0A02 \u0A26\u0A40 \u0A1C\u0A3E\u0A02\u0A1A\
    , \u0A2B\u0A3E\u0A30\u0A2E\u0A48\u0A1F \u0A15\u0A30\u0A28, \u0A2A\u0A3E\u0A30\u0A1F\
    \u0A40\u0A36\u0A28 \u0A2C\u0A23\u0A3E\u0A09\u0A23 \u0A05\u0A24\u0A47 \u0A38\u0A70\
    \u0A30\u0A1A\u0A28\u0A3E \u0A15\u0A30\u0A28 \u0A35\u0A3E\u0A38\u0A24\u0A47 \u0A21\
    \u0A3F\u0A38\u0A15\u0A3E\u0A02\u0964</p>\n<p>\u0A21\u0A3F\u0A38\u0A15\u0A3E\u0A02\
    \ \u0A26\u0A40 \u0A35\u0A30\u0A24\u0A4B\u0A02 \u0A15\u0A30\u0A15\u0A47 \u0A24\u0A41\
    \u0A38\u0A40\u0A02 SMART \u0A21\u0A3E\u0A1F\u0A3E \u0A35\u0A47\u0A16, \u0A21\u0A3F\
    \u0A35\u0A3E\u0A08\u0A38\u0A3E\u0A02 \u0A26\u0A3E \u0A07\u0A70\u0A24\u0A5B\u0A3E\
    \u0A2E \u0A15\u0A30, \u0A2D\u0A4C\u0A24\u0A3F\u0A15 \u0A21\u0A3F\u0A38\u0A15\u0A3E\
    \u0A02 \u0A32\u0A08 \u0A2C\u0A48\u0A02\u0A1A\u0A2E\u0A3E\u0A30\u0A15 \u0A32\u0A3E\
    \ \u0A05\u0A24\u0A47 USB \u0A38\u0A1F\u0A3F\u0A71\u0A15\u0A3E\u0A02 \u0A32\u0A08\
    \ \u0A08\u0A2E\u0A47\u0A5B \u0A2C\u0A23\u0A3E \u0A38\u0A15\u0A26\u0A47 \u0A39\u0A4B\
    \u0964</p>"
  lv: "<p>Diski pied\u0101v\u0101 vienk\u0101r\u0161u veidu, k\u0101 izp\u0113t\u012B\
    t, format\u0113t, sadal\u012Bt un konfigur\u0113t diskus un bloka ier\u012Bces.</p>\n\
    <p>Izmantojot \u201CDiskus\u201D, j\u016Bs varat skat\u012Bt SMART datus, p\u0101\
    rvald\u012Bt ier\u012Bces, p\u0101rbaud\u012Bt veiktsp\u0113ju un veidot USB atmi\u0146\
    as att\u0113lus.</p>"
  kk: "<p>\u0414\u0438\u0441\u043A\u0442\u0435\u0440 \u049B\u043E\u043B\u0434\u0430\
    \u043D\u0431\u0430\u0441\u044B \u043A\u04E9\u043C\u0435\u0433\u0456\u043C\u0435\
    \u043D \u0434\u0438\u0441\u043A\u0442\u0435\u0440 \u043C\u0435\u043D \u0431\u043B\
    \u043E\u043A\u0442\u044B\u049B \u049B\u04B1\u0440\u044B\u043B\u0493\u044B\u043B\
    \u0430\u0440\u0434\u044B \u0438\u043A\u0435\u043C\u0434\u0456 \u0442\u04AF\u0440\
    \u0434\u0435 \u0437\u0435\u0440\u0442\u0442\u0435\u0443, \u043F\u0456\u0448\u0456\
    \u043C\u0434\u0435\u0443, \u0431\u04E9\u043B\u0456\u043C\u0434\u0435\u0443 \u0436\
    \u04D9\u043D\u0435 \u0431\u0430\u043F\u0442\u0430\u0443\u0493\u0430 \u0431\u043E\
    \u043B\u0430\u0434\u044B.</p>\n<p>\u0414\u0438\u0441\u043A\u0442\u0435\u0440 \u049B\
    \u043E\u043B\u0434\u0430\u043D\u0431\u0430\u0441\u044B\u043C\u0435\u043D SMART\
    \ \u0434\u0435\u0440\u0435\u043A\u0442\u0435\u0440\u0456\u043D \u049B\u0430\u0440\
    \u0430\u0443, \u049B\u04B1\u0440\u044B\u043B\u0493\u044B\u043B\u0430\u0440\u0434\
    \u044B \u0431\u0430\u0441\u049B\u0430\u0440\u0443, \u0444\u0438\u0437\u0438\u043A\
    \u0430\u043B\u044B\u049B \u0434\u0438\u0441\u043A\u0442\u0435\u0440\u0434\u0456\
    \ \u0441\u044B\u043D\u0430\u0443 \u0436\u04D9\u043D\u0435 USB \u0442\u0430\u0441\
    \u0443\u0448\u044B\u043B\u0430\u0440\u044B\u043D\u0430 \u0431\u0435\u0439\u043D\
    \u0435\u043B\u0435\u0440\u0434\u0456 \u0436\u0430\u0437\u0443\u0493\u0430 \u0431\
    \u043E\u043B\u0430\u0434\u044B.</p>"
  eo: "<p>Diskoj donas al vi facilan manieron ekzameni, strukturi, subdiskigi, kaj\
    \ agordi diskojn kaj blokajn aparatojn.</p>\n<p>Uzante Diskojn, vi povas vidi\
    \ SMART-datumojn, mastrumi aparatojn, taksotesti diskojn, kaj ekzakte kopii al\
    \ po\u015Dmemoriloj.</p>"
  gd: "<p>Bheir Diosgan d\xF2igh furasta dhut gus diosgan is uidheaman bloca a sgr\xF9\
    dadh, fh\xF2rmatadh, a ph\xE0irteachadh \u2019s a r\xE8iteachadh.</p>\n<p>Le Diosgan,\
    \ \u2019s urrainn dhut d\xE0ta SMART a shealltainn, uidheaman a sti\xF9ireadh,\
    \ tomhas-measaidh air diosgan fiosaigeach a dh\xE8anamh is \xEComhaighean de USB\
    \ sticks a chruthachadh.</p>"
  nl: "<p>Met Schijven kunt u op een eenvoudige manier schijven en blokapparaten inspecteren,\
    \ formatteren, partitioneren en configureren.</p>\n<p>Met Schijven kunt u SMART-gegevens\
    \ bekijken, apparaten beheren, fysieke schijven benchmarken en schijfkopie\xEB\
    n maken van USB-sticks.</p>"
  zh_TW: "<p>\u300A\u78C1\u789F\u300B\u63D0\u4F9B\u7C21\u4FBF\u7684\u65B9\u6CD5\u4F86\
    \u6AA2\u67E5\u3001 \u683C\u5F0F\u5316\u3001 \u5206\u5272\uFF0C\u548C\u8A2D\u5B9A\
    \u78C1\u789F\u548C\u5340\u584A\u88DD\u7F6E\u3002</p>\n<p>\u4F7F\u7528\u300A\u78C1\
    \u789F\u300B\uFF0C\u60A8\u53EF\u4EE5\u6AA2\u8996 SMART \u8CC7\u6599\u3001\u7BA1\
    \u7406 RAID \u88DD\u7F6E\u3001\u7269\u7406\u78C1\u789F\u7684\u8A55\u6E2C\uFF0C\
    \u4EE5\u53CA\u88FD\u4F5C USB \u96A8\u8EAB\u789F\u6620\u50CF\u6A94\u3002\u5DE5\u4F5C\
    \u6703\u5728\u80CC\u666F\u57F7\u884C\uFF0C\u5373\u4F7F\u4F7F\u7528\u8005\u95DC\
    \u9589\u7A0B\u5F0F\u4E5F\u4E00\u6A23\u3002</p>"
