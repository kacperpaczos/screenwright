    \u043E\u0436\u0435 \u0434\u0430 \u0441\u0435 \u043E\u0431\u043E\u0433\u0430\u0442\
    \u044F\u0432\u0430 \u0441\u044A\u0441 \u0441\u043A\u0440\u0438\u043F\u0442\u043E\
    \u0432\u0435 \u0438 \u0440\u0430\u0437\u0448\u0438\u0440\u0435\u043D\u0438\u044F\
    .</p>"
  es: "<p>Archivos, tambi\xE9n conocido como Nautilus, es el gestor de archivos predeterminado\
    \ del escritorio GNOME. Proporciona una manera sencilla e integrada para gestionar\
    \ sus archivos y explorar el sistema de archivos.</p>\n<p>Nautilus soporta todas\
    \ las funciones b\xE1sicas de un gestor de archivos y algunas m\xE1s. Puede buscar\
    \ y gestionar sus archivos y carpetas, tanto locales como remotas, leer y escribir\
    \ datos de y en dispositivos extra\xEDbles, ejecutar scripts y lanzar aplicaciones.\
    \ Tiene tres vistas: rejilla de iconos, lista de iconos y \xE1rbol. Se puede ampliar\
    \ su funcionalidad con scripts y complementos.</p>"
  ko: "<p>\uD30C\uC77C(\uB178\uD2F8\uB7EC\uC2A4\uB77C\uACE0\uB3C4 \uD568)\uC740 \uADF8\
    \uB188 \uB370\uC2A4\uD06C\uD1B1\uC758 \uAE30\uBCF8 \uD30C\uC77C \uAD00\uB9AC \uD504\
    \uB85C\uADF8\uB7A8\uC785\uB2C8\uB2E4. \uC774 \uD504\uB85C\uADF8\uB7A8\uC744 \uC774\
    \uC6A9\uD574 \uAC04\uB2E8\uD558\uACE0 \uD1B5\uD569\uB41C \uBC29\uC2DD\uC73C\uB85C\
    \ \uD30C\uC77C\uC744 \uAD00\uB9AC\uD558\uACE0 \uD30C\uC77C \uC2DC\uC2A4\uD15C\uC744\
    \ \uCC3E\uC544 \uBCFC \uC218 \uC788\uC2B5\uB2C8\uB2E4.</p>\n<p>\uB178\uD2F8\uB7EC\
    \uC2A4\uB294 \uD30C\uC77C \uAD00\uB9AC\uC790\uC758 \uBAA8\uB4E0 \uAE30\uBCF8 \uAE30\
    \uB2A5\uC744 \uC9C0\uC6D0\uD558\uACE0 \uB354 \uB9CE\uC740 \uAE30\uB2A5\uC774 \uC788\
    \uC2B5\uB2C8\uB2E4. \uB178\uD2F8\uB7EC\uC2A4\uC5D0\uC11C \uB85C\uCEEC\uC774\uB4E0\
    \ \uC6D0\uACA9 \uBAA8\uB450\uC5D0 \uC788\uB294 \uD30C\uC77C\uACFC \uD3F4\uB354\
    \uB97C \uAC80\uC0C9\uD558\uACE0 \uAD00\uB9AC\uD560 \uC218 \uC788\uACE0, \uC774\
    \uB3D9\uC2DD \uBBF8\uB514\uC5B4\uC5D0\uC11C \uB370\uC774\uD130\uB97C \uC77D\uACE0\
    \ \uC4F8 \uC218 \uC788\uACE0, \uC2A4\uD06C\uB9BD\uD2B8\uC640 \uC571\uC744 \uC2E4\
    \uD589\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uB178\uD2F8\uB7EC\uC2A4\uB294 \uC138\
    \ \uAC00\uC9C0 \uC885\uB958\uC758 \uBCF4\uAE30 \uBAA8\uB4DC\uAC00 \uC788\uC2B5\
    \uB2C8\uB2E4. \uC544\uC774\uCF58 \uACA9\uC790, \uC544\uC774\uCF58 \uBAA9\uB85D\
    , \uACC4\uCE35 \uAD6C\uC870 \uBAA9\uB85D\uC785\uB2C8\uB2E4. \uB178\uD2F8\uB7EC\
    \uC2A4\uC758 \uAE30\uB2A5\uC740 \uD50C\uB7EC\uADF8\uC778\uACFC \uC2A4\uD06C\uB9BD\
    \uD2B8\uB97C \uC774\uC6A9\uD574 \uD655\uC7A5\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4\
    .</p>"
  sl: "<p>Program Nautilus, znan tudi z imenom Datoteke, je privzeti upravljalnik\
    \ datotek za namizje GNOME. Enostaven vmesnik in \u0161iroka povezanost programnika\
    \ omogo\u010Da brskanje in upravljanje datotek tudi znotraj razli\u010Dnih programov.</p>\n\
    <p>Program Nautilus podpira vse osnovne funkcije upravljalnika datotek in \u0161\
    e mnogo ve\u010D. Omogo\u010Da iskanje in urejanje datotek in map krajevno in\
    \ v omre\u017Eju, branje in pisanje podatkov na odstranljive nosilce, zagon skriptov\
    \ in programov. Podpira tri poglede: ikonski, seznamski in drevesni. Vse funkcije\
    \ je mogo\u010De raz\u0161iriti s vstavki in skripti.</p>"
  en_GB: '<p>Files, also known as Nautilus, is the default file manager of the GNOME
    desktop. It provides a simple and integrated way of managing your files and browsing
    your file system.</p>

    <p>Nautilus supports all the basic functions of a file manager and more. It can
    search and manage your files and folders, both locally and on a network, read
    and write data to and from removable media, run scripts, and launch apps. It has
    three views: Icon Grid, Icon List, and Tree List. Its functions can be extended
    with plug-ins and scripts.</p>'
  tr: "<p>Nautilus olarak da bilinen Dosyalar, GNOME masa\xFCst\xFCn\xFCn \xF6ntan\u0131\
    ml\u0131 dosya y\xF6neticisidir. Kolay ve t\xFCmle\u015Fik bi\xE7imde dosyalar\u0131\
    n\u0131z\u0131 y\xF6netmenizi ve dosya sisteminizde gezinmenizi sa\u011Flar.</p>\n\
    <p>Nautilus, bir dosya y\xF6neticisindeki t\xFCm temel i\u015Flevleri ve daha\
    \ \xE7o\u011Funu bulundurur. Hem bilgisayar\u0131n\u0131zdaki hem de a\u011Fdaki\
    \ dosyalar\u0131n\u0131z\u0131 ve klas\xF6rlerinizi arayabilir ve y\xF6netebilir,\
    \ \xE7\u0131kar\u0131labilir ortamlara veri yazabilir ve okuyabilir, betik ve\
    \ uygulamalar\u0131 \xE7al\u0131\u015Ft\u0131rabilir. \xDC\xE7 t\xFCr g\xF6r\xFC\
    n\xFCm\xFC bulunur: Simge, Liste ve A\u011Fa\xE7. Nautilus\u2019un i\u015Flevleri\
    \ eklentiler ve betiklerle geni\u015Fletilebilir.</p>"
  id: '<p>Berkas, yang juga dikenal sebagai Nautilus, adalah manajer berkas bawaan
    dari destop GNOME. Ini menyediakan cara terintegrasi dan sederhana untuk pengelolaan
    berkas-berkas Anda dan meramban sistem berkas Anda.</p>

    <p>Nautilus mendukung semua fungsi dasar dari suatu manajer berkas dan lebih.
    Ini dapat mencari dan mengelola berkas dan folder Anda, lokal dan pada jaringan,
    membaca dan menulis data ke dan dari media lepas pasang, menjalankan skrip, dan
    meluncurkan aplikasi. Ini memiilki tiga tilikan, Kisi Ikon, Daftar Ikon, dan Daftar
    Pohon. Fungsinya bisa diperluas dengan pengaya dan skrip.</p>'
  cs: "<p>Aplikace Soubory, zn\xE1m\xE1 i pod n\xE1zvem Nautilus, je v\xFDchoz\xED\
    \ spr\xE1vce soubor\u016F pro u\u017Eivatelsk\xE9 prost\u0159ed\xED GNOME. Poskytuje\
    \ jednoduchou a dob\u0159e za\u010Dlen\u011Bnou spr\xE1vu va\u0161ich soubor\u016F\
    \ a proch\xE1zen\xED va\u0161\xEDm souborov\xFDm syst\xE9mem.</p>\n<p>Podporuje\
    \ v\u0161echny z\xE1kladn\xED funkce o\u010Dek\xE1van\xE9 od spr\xE1vce soubor\u016F\
    \ a k tomu n\u011Bco nav\xEDc. Um\xED vyhled\xE1vat a spravovat va\u0161e soubory\
    \ a slo\u017Eky, jak m\xEDstn\xED, tak s\xED\u0165ov\xE9, \u010D\xEDst a zapisovat\
    \ data z/na v\xFDm\u011Bnn\xE1 m\xE9dia, spou\u0161t\u011Bt skripty a aplikace.\
    \ M\xE1 t\u0159i zp\u016Fsoby zobrazen\xED: ikony v m\u0159\xED\u017Ece, seznam\
    \ s ikonami a stromov\xE9 zobrazen\xED. Funk\u010Dnost je mo\u017En\xE9 roz\u0161\
    i\u0159ovat pomoc\xED z\xE1suvn\xFDch modul\u016F a skript\u016F.</p>"
  sr: "<p>\u0414\u0430\u0442\u043E\u0442\u0435\u043A\u0435, \u0442\u0430\u043A\u043E\
    \u0452\u0435 \u043F\u043E\u0437\u043D\u0430\u0442\u0435 \u0438 \u043A\u0430\u043E\
