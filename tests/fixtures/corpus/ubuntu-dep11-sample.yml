    \u03B7\u03C3\u03B7\u03C2, \u03B4\u03B9\u03B1\u03BC\u03CC\u03C1\u03C6\u03C9\u03C3\
    \u03B7\u03C2, \u03BA\u03B1\u03C4\u03AC\u03C4\u03BC\u03B7\u03C3\u03B7\u03C2 \u03BA\
    \u03B1\u03B9 \u03C1\u03CD\u03B8\u03BC\u03B9\u03C3\u03B7\u03C2 \u03C3\u03C5\u03C3\
    \u03BA\u03B5\u03C5\u03CE\u03BD \u03B4\u03AF\u03C3\u03BA\u03C9\u03BD \u03BA\u03B1\
    \u03B9 \u03BF\u03BC\u03AC\u03B4\u03C9\u03BD.</p>\n<p>\u03A7\u03C1\u03B7\u03C3\u03B9\
    \u03BC\u03BF\u03C0\u03BF\u03B9\u03CE\u03BD\u03C4\u03B1\u03C2 \u03C4\u03BF \u0394\
    \u03AF\u03C3\u03BA\u03BF\u03B9, \u03BC\u03C0\u03BF\u03C1\u03B5\u03AF\u03C4\u03B5\
    \ \u03BD\u03B1 \u03C0\u03C1\u03BF\u03B2\u03AC\u03BB\u03B5\u03C4\u03B5 \u03B4\u03B5\
    \u03B4\u03BF\u03BC\u03AD\u03BD\u03B1 SMART, \u03BD\u03B1 \u03B4\u03B9\u03B1\u03C7\
    \u03B5\u03B9\u03C1\u03B9\u03C3\u03C4\u03B5\u03AF\u03C4\u03B5 \u03C3\u03C5\u03C3\
    \u03BA\u03B5\u03C5\u03AD\u03C2, \u03BD\u03B1 \u03BC\u03B5\u03C4\u03C1\u03AE\u03C3\
    \u03B5\u03C4\u03B5 \u03C4\u03B9\u03C2 \u03B5\u03C0\u03B9\u03B4\u03CC\u03C3\u03B5\
    \u03B9\u03C2 \u03C4\u03C9\u03BD \u03C6\u03C5\u03C3\u03B9\u03BA\u03CE\u03BD \u03B4\
    \u03AF\u03C3\u03BA\u03C9\u03BD \u03BA\u03B1\u03B9 \u03B5\u03B9\u03BA\u03CC\u03BD\
    \u03C9\u03BD USB sticks.</p>"
  uk: "<p>\u0414\u0438\u0441\u043A\u0438 \u043D\u0430\u0434\u0430\u044E\u0442\u044C\
    \ \u043F\u0440\u043E\u0441\u0442\u0438\u0439 \u0441\u043F\u043E\u0441\u0456\u0431\
