Description:
  he: "<p>\u05DB\u05D5\u05E0\u05E0\u05D9\u05DD \u05DE\u05E1\u05E4\u05E7 \u05D3\u05E8\
    \u05DA \u05E7\u05DC\u05D4 \u05DC\u05D1\u05D3\u05D5\u05E7, \u05DC\u05E4\u05E8\u05DE\
    \u05D8, \u05DC\u05D7\u05DC\u05E7 \u05D5\u05DC\u05D4\u05D2\u05D3\u05D9\u05E8 \u05DB\
    \u05D5\u05E0\u05E0\u05D9\u05DD \u05D5\u05D4\u05EA\u05E7\u05E0\u05D9\u05DD.</p>\n\
    <p>\u05D1\u05E9\u05D9\u05DE\u05D5\u05E9 \u05D1\u05DB\u05D5\u05E0\u05E0\u05D9\u05DD\
    , \u05E0\u05EA\u05DF \u05DC\u05E6\u05E4\u05D5\u05EA \u05D1\u05E0\u05EA\u05D5\u05E0\
    \u05D9 SMART, \u05DC\u05E0\u05D4\u05DC \u05D4\u05EA\u05E7\u05E0\u05D9\u05DD, \u05DC\
    \u05D1\u05E6\u05E2 \u05D1\u05D3\u05D9\u05E7\u05EA \u05E0\u05EA\u05D5\u05E0\u05D9\
    \u05DD \u05E4\u05D9\u05D6\u05D9\u05EA \u05DC\u05DB\u05D5\u05E0\u05E0\u05D9\u05DD\
    , \u05D5\u05D9\u05E6\u05D9\u05E8\u05EA \u05D3\u05DE\u05D5\u05D9\u05D5\u05EA \u05DB\
    \u05D5\u05E0\u05DF \u05DC\u05BEUSB.</p>"
  fur: "<p>Discs al furn\xECs une maniere semplice par ispezion\xE2, format\xE2, partizion\xE2\
    \ e configur\xE2 discs e disposit\xEEfs a blocs.</p>\n<p>Doprant Discs, tu puedis\
    \ viodi d\xE2ts SMART, ministr\xE2 disposit\xEEfs RAID, misur\xE2 lis prestazions\
    \ dai discs fisics e f\xE2 imagjins di penis USB.</p>"
  eu: '<p>''Diskoak'' tresnak disko eta blokeko gailuak aztertzeko, formatu emateko,
    partizioak egiteko eta konfiguratzeko modu erraza eskaintzen du.</p>

    <p>''Diskoak'' erabiliz SMART datuak ikus dezakezu, gailuak kudeatu, disko fisikoen
    errendimendua aztertu edo eta USB gailuen irudiak sortu.</p>'
  vi: "<p>\u0110\u0129a gi\xFAp b\u1EA1n d\u1EC5 d\xE0ng ki\u1EC3m tra, \u0111\u1ECB\
    nh d\u1EA1ng, ph\xE2n v\xF9ng v\xE0 c\u1EA5u h\xECnh \u0111\u0129a v\xE0 thi\u1EBF\
    t b\u1ECB kh\u1ED1i.</p>\n<p>D\xF9ng \u0110\u0129a, b\u1EA1n c\xF3 th\u1EC3 xem\
    \ d\u1EEF li\u1EC7u SMART, qu\u1EA3n l\xFD c\xE1c thi\u1EBFt b\u1ECB, \u0111o\
    \ ki\u1EC3m t\u1ED1c \u0111\u1ED9 \u0111\u0129a v\u1EADt l\xFD, v\xE0 \u1EA3nh\
    \ \u0111\u0129a USB.</p>"
  sr@latin: "<p>Diskovi vam pru\u017Eaju lak na\u010Din za proveru, formatiranje,\
    \ particionisanje i pode\u0161avanje diskova i blok ure\u0111aja.</p>\n<p>Kori\u0161\
    \u0107enjem Diskova mo\u017Eete videti SMART podatke, upravljati ure\u0111ajima,\
    \ meriti odlike fizi\u010Dkih diskova i praviti odraze USB \u0161tapi\u0107a.</p>"
  ca@valencia: '<p>El Discs ofereix una forma senzilla d''inspeccionar, formatar,
    crear particions, i configurar discs i dispositius de blocs.</p>

    <p>Amb el Discs, podeu veure les dades SMART, gestionar dispositius, proves de
    rendiment dels discs i imatges en llapis USB. </p>'
  nb: "<p>Disker gir deg en enkel m\xE5te \xE5 se p\xE5, formatere, partisjonere og\
    \ konfigurere disker og andre blokkenheter.</p>\n<p>Med Disker kan du vise SMART-data,\
    \ h\xE5ndtere RAID-enheter, sjekke ytelse p\xE5 fysiske disker og lage bilder\
    \ av USB-minnepinner.</p>"
  zh_CN: "<p>\u78C1\u76D8\u63D0\u4F9B\u4E86\u4E00\u79CD\u7B80\u5355\u7684\u65B9\u6CD5\
    \u6765\u68C0\u67E5\u3001\u683C\u5F0F\u5316\u3001\u5206\u533A\u5E76\u914D\u7F6E\
    \u78C1\u76D8\u548C\u5757\u8BBE\u5907\u3002</p>\n<p>\u4F7F\u7528\u78C1\u76D8\uFF0C\
    \u60A8\u53EF\u4EE5\u67E5\u770B SMART \u6570\u636E\uFF0C\u7BA1\u7406 RAID \u8BBE\
    \u5907\uFF0C\u5BF9\u7269\u7406\u78C1\u76D8\u8FDB\u884C\u6027\u80FD\u6D4B\u8BD5\
    \u53CA\u83B7\u53D6 U \u76D8\u955C\u50CF\u3002</p>"
  ja: "<p>GNOME Disks \u306F\u30C7\u30A3\u30B9\u30AF\u3084\u30D6\u30ED\u30C3\u30AF\
    \u30C7\u30D0\u30A4\u30B9\u306E\u691C\u67FB\u3001\u30D5\u30A9\u30FC\u30DE\u30C3\
    \u30C8\u3001\u30D1\u30FC\u30C6\u30A3\u30B7\u30E7\u30CB\u30F3\u30B0\u3001\u8A2D\
    \u5B9A\u3092\u7C21\u5358\u306B\u3067\u304D\u308B\u3088\u3046\u306B\u3059\u308B\
    \u30E6\u30FC\u30C6\u30A3\u30EA\u30C6\u30A3\u3067\u3059\u3002</p>\n<p>GNOME Disks\
    \ \u3092\u4F7F\u7528\u3059\u308B\u3068\u3001SMART \u30C7\u30FC\u30BF\u306E\u78BA\
    \u8A8D\u3001\u30C7\u30D0\u30A4\u30B9\u306E\u7BA1\u7406\u3001\u7269\u7406\u30C7\
    \u30A3\u30B9\u30AF\u306E\u30D9\u30F3\u30C1\u30DE\u30FC\u30AF\u3001USB \u30E1\u30E2\
    \u30EA\u3078\u306E\u30C7\u30A3\u30B9\u30AF\u30A4\u30E1\u30FC\u30B8\u66F8\u304D\
    \u8FBC\u307F\u304C\u3067\u304D\u307E\u3059\u3002</p>"
  pt_BR: "<p>O aplicativo Discos oferece uma forma f\xE1cil de inspecionar, formatar,\
    \ particionar e configurar discos e dispositivos de bloco.</p>\n<p>Ao usar o aplicativo\
    \ Discos, voc\xEA pode ver dados de SMART, gerenciar dispositivos, fazer avalia\xE7\
    \xF5es de performance de discos f\xEDsicos, e criar imagens de dispositivos USB.</p>"
  de: "<p>Laufwerke bietet eine einfache M\xF6glichkeit zum Inspizieren, Formatieren,\
    \ Partitionieren und Konfigurieren von Festplatten und Blockger\xE4ten.</p>\n\
    <p>Durch die Verwendung von Laufwerke k\xF6nnen Sie SMART-Daten ansehen, RAID-Ger\xE4\
    te verwalten, die Leistung von Festplatten testen und USB-Datentr\xE4ger bespielen.</p>"
  ms: '<p>Cakera menyediakan cara termudah untuk memeriksa, memformat, membuat sekatan,
    dan mengkonfigur cakera dan peranti blok.</p>

    <p>Dengan menggunakan Cakera, anda boleh lihat data SMART, urus peranti, tanda
    aras cakera fizikal, dan imejkan pemacu pena USB.</p>'
  be: "<p>\u041F\u0440\u0430\u0433\u0440\u0430\u043C\u0430 \xAB\u0414\u044B\u0441\u043A\
    \u0456\xBB - \u0433\u044D\u0442\u0430 \u0437\u0440\u0443\u0447\u043D\u044B \u0441\
    \u043F\u043E\u0441\u0430\u0431 \u043F\u0440\u0430\u0433\u043B\u044F\u0434\u0430\
    \u0446\u044C, \u043F\u0430\u0434\u0437\u044F\u043B\u044F\u0446\u044C \u043D\u0430\
    \ \u0440\u0430\u0437\u0434\u0437\u0435\u043B\u044B \u0456 \u043D\u0430\u043B\u0430\
