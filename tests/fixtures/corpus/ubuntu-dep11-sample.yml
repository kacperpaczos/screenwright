    \u0434\u044B.</p>\n<p>\u0417 \u0434\u0430\u043F\u0430\u043C\u043E\u0433\u0430\u0439\
    \ \u043F\u0440\u0430\u0433\u0440\u0430\u043C\u044B \xAB\u0414\u044B\u0441\u043A\
    \u0456\xBB \u0432\u044B \u043C\u043E\u0436\u0430\u0446\u0435 \u043F\u0440\u0430\
    \u0433\u043B\u044F\u0434\u0430\u0446\u044C \u0434\u0430\u043D\u044B\u044F SMART,\
    \ \u043A\u0456\u0440\u0430\u0432\u0430\u0446\u044C \u043F\u0440\u044B\u043B\u0430\
    \u0434\u0430\u043C\u0456, \u0442\u044D\u0441\u0442\u0430\u0432\u0430\u0446\u044C\
    \ \u0444\u0456\u0437\u0456\u0447\u043D\u044B\u044F \u0434\u044B\u0441\u043A\u0456\
    , \u0441\u0442\u0432\u0430\u0440\u0430\u0446\u044C \u0432\u043E\u0431\u0440\u0430\
    \u0437\u044B USB \u0434\u044B\u0441\u043A\u0430\u045E.</p>"
  gl: "<p>Discos fornece unha forma doada de inspeccionar, formatar, partici\xF3n\
    \ e configurar discos e dispositivos de bloque.</p>\n<p>Usando Discos, pode ver\
    \ datos SMART, xestionar dispositivos RAID, facer probas de rendemento en discos\
    \ fixos e chaves USB.</p>"
  pt: "<p>O Discos propicia uma forma f\xE1cil de inspecionar, formatar, criar parti\xE7\
    \xF5es e configurar discos e dispositivos de blocos.</p>\n<p>Ao usar o Discos,\
    \ pode ver dados SMART, gerir dispositivos, analisar discos f\xEDsicos e efetuar\
    \ imagens de unidades USB.</p>"
  hr: "<p>Diskovi pru\u017Eaju jednostavan na\u010Din za provjeru, formatiranje, particioniranje,\
    \ i pode\u0161avanje diskova i blokova ure\u0111aja.</p>\n<p>Upotrebom Diskova\
    \ mo\u017Eete vidjeti SMART podatke, upravljati ure\u0111ajima, testirati fizi\u010D\
    ke diskove i stvarati slike USB ure\u0111aja.</p>"
  ro: "<p>Discuri furnizeaz\u0103 o metod\u0103 facil\u0103 de a inspecta, formata,\
    \ parti\u021Biona, \u0219i configura discuri \u0219i dispozitive de bloc.</p>\n\
    <p>Utiliz\xE2nd Discuri, pute\u021Bi vizualiza date SMART, administra dispozitive,\
    \ efectua teste de performan\u021B\u0103 pe discuri fizice, \u0219i instala imagini\
    \ pe stickuri USB.</p>"
  fa: "<p>\u062F\u06CC\u0633\u06A9\u200C\u0647\u0627 \u0631\u0627\u0647\u06CC \u0622\
