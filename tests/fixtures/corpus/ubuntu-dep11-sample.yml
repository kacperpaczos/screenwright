    \u044B \u043D\u0430 USB \u043D\u043E\u0441\u0438\u0442\u0435\u043B\u0438.</p>"
  el: "<p>\u039F\u03B9 \u0394\u03AF\u03C3\u03BA\u03BF\u03B9 \u03C0\u03B1\u03C1\u03AD\
