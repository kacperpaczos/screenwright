    \u0458\u0443\u043C\u0430, \u0434\u0430 \u0438\u0437\u0432\u0440\u0448\u0430\u0432\
    \u0430 \u0441\u043A\u0440\u0438\u043F\u0442\u0435, \u0438 \u0434\u0430 \u043F\u043E\
    \u043A\u0440\u0435\u045B\u0435 \u043F\u0440\u043E\u0433\u0440\u0430\u043C\u0435\
    . \u041F\u043E\u0441\u0435\u0434\u0443\u0458\u0435 \u0442\u0440\u0438 \u043F\u0440\
    \u0435\u0433\u043B\u0435\u0434\u0430: \u043C\u0440\u0435\u0436\u0443 \u0438\u043A\
    \u043E\u043D\u0438\u0446\u0430, \u0441\u043F\u0438\u0441\u0430\u043A \u0438\u043A\
    \u043E\u043D\u0438\u0446\u0430 \u0438 \u043F\u0440\u0435\u0433\u043B\u0435\u0434\
    \ \u0443 \u0441\u0442\u0430\u0431\u043B\u0443. \u040A\u0435\u0433\u043E\u0432\u0435\
    \ \u0444\u0443\u043D\u043A\u0446\u0438\u0458\u0435 \u043C\u043E\u0433\u0443 \u0431\
    \u0438\u0442\u0438 \u043F\u0440\u043E\u0448\u0438\u0440\u0435\u043D\u0435 \u043F\
    \u0440\u0438\u043A\u0459\u0443\u0447\u0446\u0438\u043C\u0430 \u0438 \u0441\u043A\
    \u0440\u0438\u043F\u0442\u0430\u043C\u0430.</p>"
  it: "<p>File, noto anche come \xABNautilus\xBB, \xE8 il gestore di file predefinito\
    \ dell'ambiente grafico GNOME. Fornisce gestione dei file ed esplorazione del\
    \ file system semplici e integrate.</p>\n<p>Nautilus supporta tutte le funzionalit\xE0\
    \ di base di un gestore di file e molto altro: \xE8 in grado di eseguire ricerche\
    \ e gestire file e cartelle (localmente e da remoto), leggere e scrivere da supporti\
    \ rimovibili, eseguire script e lanciare applicazioni. Dispone di tre diverse\
    \ tipologie di visualizzazione: una griglia ad icone, un elenco ad icone e un\
    \ elenco ad albero. \xC8 possibile estenderne le funzionalit\xE0 attraverso plugin\
    \ e script.</p>"
  fi: "<p>Tiedostot, joka tunnetaan my\xF6s nimell\xE4 Nautilus, on Gnome-ty\xF6p\xF6\
    yd\xE4n tiedostonhallinnan oletussovellus. Sen avulla tiedostojen selailu ja hallinta\
    \ on vaivatonta.</p>\n<p>Nautilus tukee kaikkia tiedostonhallintasovellusten perustoimintoja.\
    \ Sen avulla voit etsi\xE4 ja hallita niin paikallisia kuin verkossa olevia tiedostoja\
    \ sek\xE4 kansioita, lukea ja kirjoittaa tietoa erillisiin tallennusv\xE4lineisiin,\
    \ suorittaa komentosarjoja ja k\xE4ynnist\xE4\xE4 sovelluksia. Se tukee kolmea\
    \ eri n\xE4kym\xE4\xE4: kuvakeruudukko, kuvakeluettelo ja puuluettelo. Sovelluksen\
    \ toimintaa on mahdollista laajentaa liit\xE4nn\xE4isill\xE4 ja komentosarjoilla.</p>"
  pl: "<p>Mened\u017Cer plik\xF3w, znany tak\u017Ce jako Nautilus, jest domy\u015B\
    lnym mened\u017Cerem plik\xF3w dla \u015Brodowiska GNOME. Dostarcza on prosty\
    \ i\_zintegrowany spos\xF3b na zarz\u0105dzanie plikami i\_przegl\u0105danie systemu\
    \ plik\xF3w.</p>\n<p>Program Nautilus obs\u0142uguje wszystkie podstawowe funkcje\
    \ mened\u017Cera plik\xF3w, a\_tak\u017Ce wiele wi\u0119cej. Mo\u017Ce wyszukiwa\u0107\
    \ i\_zarz\u0105dza\u0107 plikami i\_katalogami, zar\xF3wno lokalnie, jak i\_w\_\
    sieci, odczytywa\u0107 i\_zapisywa\u0107 dane na i\_z\_no\u015Bnik\xF3w wymiennych,\
    \ wykonywa\u0107 skrypty i\_uruchamia\u0107 programy. Ma on trzy widoki: siatk\u0119\
    \ ikon, list\u0119 ikon i\_list\u0119 w\_formie drzewa. Jego funkcje mog\u0105\
    \ by\u0107 rozszerzane za pomoc\u0105 wtyczek i\_skrypt\xF3w.</p>"
  hu: "<p>A F\xE1jlok, m\xE1s n\xE9ven Nautilus a GNOME asztali k\xF6rnyezet alap\xE9\
    rtelmezett f\xE1jlkezel\u0151je. Egyszer\u0171 \xE9s integr\xE1lt lehet\u0151\
    s\xE9geket ny\xFAjt a f\xE1jlok kezel\xE9s\xE9hez \xE9s f\xE1jlrendszere tall\xF3\
    z\xE1s\xE1hoz.</p>\n<p>A Nautilus t\xE1mogatja a f\xE1jlkezel\u0151k alapvet\u0151\
    \ funkci\xF3it \xE9s m\xE9g sok m\xE1st is. K\xE9pes f\xE1jlok \xE9s mapp\xE1\
    k keres\xE9s\xE9re \xE9s kezel\xE9s\xE9re helyileg \xE9s a h\xE1l\xF3zaton egyar\xE1\
    nt, adatokat olvasni \xE9s \xEDrni cser\xE9lhet\u0151 adathordoz\xF3kra, parancsf\xE1\
    jlokat futtatni \xE9s alkalmaz\xE1sokat elind\xEDtani. H\xE1rom n\xE9zete van:\
    \ ikonr\xE1cs, ikonlista \xE9s falista. Funkcionalit\xE1sa b\u0151v\xEDtm\xE9\
    nyekkel \xE9s parancsf\xE1jlokkal b\u0151v\xEDthet\u0151.</p>"
  pa: "<p>\u0A2B\u0A3E\u0A07\u0A32\u0A5B (Files), \u0A1C\u0A3F\u0A38 \u0A28\u0A42\u0A70\
    \ \u0A28\u0A1F\u0A40\u0A32\u0A38 \u0A35\u0A40 \u0A15\u0A39\u0A3F\u0A70\u0A26\u0A47\
    \ \u0A39\u0A28, \u0A17\u0A28\u0A4B\u0A2E \u0A21\u0A48\u0A38\u0A15\u0A1F\u0A3E\u0A2A\
    \ \u0A32\u0A08 \u0A21\u0A3F\u0A2B\u0A3E\u0A32\u0A1F \u0A2B\u0A3E\u0A07\u0A32 \u0A2E\
    \u0A48\u0A28\u0A47\u0A1C\u0A30 \u0A39\u0A48\u0964 \u0A07\u0A39 \u0A24\u0A41\u0A39\
    \u0A3E\u0A21\u0A40\u0A06\u0A02 \u0A2B\u0A3E\u0A07\u0A32\u0A3E\u0A02 \u0A26\u0A47\
    \ \u0A2A\u0A4D\u0A30\u0A2C\u0A70\u0A27 \u0A05\u0A24\u0A47 \u0A24\u0A41\u0A39\u0A3E\
    \u0A21\u0A47 \u0A2B\u0A3E\u0A07\u0A32 \u0A38\u0A3F\u0A38\u0A1F\u0A2E \u0A26\u0A40\
    \ \u0A1D\u0A32\u0A15 \u0A35\u0A47\u0A16\u0A3E\u0A09\u0A23 \u0A32\u0A08 \u0A38\u0A27\
    \u0A3E\u0A30\u0A28 \u0A05\u0A24\u0A47 \u0A38\u0A3E\u0A02\u0A1D\u0A3E \u0A22\u0A70\
    \u0A17 \u0A26\u0A3F\u0A70\u0A26\u0A3E \u0A39\u0A48\u0964</p>\n<p>\u0A28\u0A1F\u0A40\
    \u0A32\u0A38 \u0A2B\u0A3E\u0A07\u0A32 \u0A2E\u0A48\u0A28\u0A47\u0A1C\u0A30 \u0A32\
    \u0A08 \u0A38\u0A2D \u0A2E\u0A41\u0A71\u0A22\u0A32\u0A40\u0A06\u0A02 \u0A38\u0A39\
    \u0A42\u0A32\u0A24 \u0A26\u0A3F\u0A70\u0A26\u0A3E \u0A39\u0A48\u0964 \u0A07\u0A39\
    \ \u0A24\u0A41\u0A39\u0A3E\u0A21\u0A40\u0A06\u0A02 \u0A2B\u0A3E\u0A07\u0A32\u0A3E\
    \u0A02 \u0A24\u0A47 \u0A2B\u0A4B\u0A32\u0A21\u0A30\u0A3E\u0A02 \u0A32\u0A08 \u0A32\
    \u0A4B\u0A15\u0A32 \u0A05\u0A24\u0A47 \u0A28\u0A48\u0A71\u0A1F\u0A35\u0A30\u0A15\
    , \u0A26\u0A4B\u0A35\u0A3E\u0A02 \u0A09\u0A71\u0A24\u0A47 \u0A32\u0A71\u0A2D\u0A23\
    \ \u0A05\u0A24\u0A47 \u0A09\u0A39\u0A28\u0A3E\u0A02 \u0A26\u0A47 \u0A2A\u0A4D\u0A30\
    \u0A2C\u0A70\u0A27 \u0A32\u0A08, \u0A39\u0A1F\u0A3E\u0A09\u0A23\u0A2F\u0A4B\u0A17\
    \ \u0A2E\u0A40\u0A21\u0A3F\u0A06 \u0A09\u0A71\u0A24\u0A47 \u0A21\u0A3E\u0A1F\u0A3E\
    \ \u0A32\u0A3F\u0A16\u0A23 \u0A24\u0A47 \u0A2A\u0A5C\u0A4D\u0A39\u0A28, \u0A38\
    \u0A15\u0A4D\u0A30\u0A3F\u0A2A\u0A1F\u0A3E\u0A02 \u0A1A\u0A32\u0A3E\u0A09\u0A23\
    \ \u0A05\u0A24\u0A47 \u0A10\u0A2A \u0A1A\u0A32\u0A3E\u0A09\u0A23 \u0A32\u0A08\
    \ \u0A2E\u0A71\u0A26\u0A26 \u0A15\u0A30 \u0A38\u0A15\u0A26\u0A3E \u0A39\u0A48\u0964\
    \ \u0A07\u0A38 \u0A35\u0A3F\u0A71\u0A1A \u0A24\u0A3F\u0A70\u0A28 \u0A1D\u0A32\u0A15\
    \u0A3E\u0A02 \u0A39\u0A28: \u0A06\u0A08\u0A15\u0A3E\u0A28 \u0A17\u0A30\u0A3F\u0A71\
    \u0A21, \u0A06\u0A08\u0A15\u0A3E\u0A28 \u0A38\u0A42\u0A1A\u0A40, \u0A05\u0A24\u0A47\
    \ \u0A1F\u0A30\u0A40 \u0A38\u0A42\u0A1A\u0A40\u0964 \u0A07\u0A38 \u0A26\u0A47\
    \ \u0A15\u0A70\u0A2E\u0A3E\u0A02 \u0A28\u0A42\u0A70 \u0A2A\u0A32\u0A71\u0A17\u0A07\
    \u0A28 \u0A05\u0A24\u0A47 \u0A38\u0A15\u0A4D\u0A30\u0A3F\u0A2A\u0A1F\u0A3E\u0A02\
    \ \u0A28\u0A3E\u0A32 \u0A35\u0A27\u0A3E\u0A07\u0A06 \u0A1C\u0A3E \u0A38\u0A15\u0A26\
    \u0A3E \u0A39\u0A48\u0964</p>"
  kk: "<p>\u0424\u0430\u0439\u043B\u0434\u0430\u0440 (\u0441\u043E\u043D\u044B\u043C\
    \u0435\u043D \u049B\u0430\u0442\u0430\u0440 Nautilus \u0440\u0435\u0442\u0456\u043D\
    \u0434\u0435 \u0431\u0435\u043B\u0433\u0456\u043B\u0456) - \u0431\u04B1\u043B\
    \ GNOME \u0436\u04B1\u043C\u044B\u0441 \u04AF\u0441\u0442\u0435\u043B\u0456 \u04AF\
    \u0448\u0456\u043D \u043D\u0435\u0433\u0456\u0437\u0433\u0456 \u0444\u0430\u0439\
    \u043B\u0434\u044B\u049B \u0431\u0430\u0441\u049B\u0430\u0440\u0443\u0448\u044B\
    \u0441\u044B. \u041E\u043B \u0444\u0430\u0439\u043B\u0434\u0430\u0440\u0434\u044B\
    \ \u0431\u0430\u0441\u049B\u0430\u0440\u0443 \u0436\u04D9\u043D\u0435 \u0436\u04AF\
    \u0439\u0435\u043D\u0456 \u0448\u043E\u043B\u0443\u0434\u044B\u04A3 \u049B\u0430\
    \u0440\u0430\u043F\u0430\u0439\u044B\u043C \u0436\u04D9\u043D\u0435 \u0438\u043D\
    \u0442\u0435\u0433\u0440\u0430\u0446\u0438\u044F\u043B\u0430\u043D\u0493\u0430\
    \u043D \u0436\u043E\u043B\u044B\u043D \u04B1\u0441\u044B\u043D\u0430\u0434\u044B\
    .</p>\n<p>Nautilus \u0444\u0430\u0439\u043B\u0434\u0430\u0440 \u0431\u0430\u0441\
    \u049B\u0430\u0440\u0443\u0448\u044B\u0441\u044B\u043D\u044B\u04A3 \u0431\u0430\
    \u0440\u043B\u044B\u049B \u049B\u0430\u0440\u0430\u043F\u0430\u0439\u044B\u043C\
    , \u0436\u04D9\u043D\u0435 \u043E\u0434\u0430\u043D \u0434\u0430 \u043A\u04E9\u043F\
    \ \u043C\u04AF\u043C\u043A\u0456\u043D\u0434\u0456\u043A\u0442\u0435\u0440\u0456\
    \u043D \u049B\u043E\u043B\u0434\u0430\u0439\u0434\u044B. \u041E\u043B \u0436\u0435\
    \u0440\u0433\u0456\u043B\u0456\u043A\u0442\u0456 \u0436\u04D9\u043D\u0435 \u0436\
    \u0435\u043B\u0456\u0434\u0435\u0433\u0456 \u0444\u0430\u0439\u043B\u0434\u0430\
    \u0440 \u0436\u04D9\u043D\u0435 \u0431\u0443\u043C\u0430\u043B\u0430\u0440\u0434\
    \u044B \u0456\u0437\u0434\u0435\u043F, \u043E\u043B\u0430\u0440\u0434\u044B \u0431\
    \u0430\u0441\u049B\u0430\u0440\u0430 \u0430\u043B\u0430\u0434\u044B, \u0430\u0443\
    \u044B\u0441\u0442\u044B\u0440\u043C\u0430\u043B\u044B \u0442\u0430\u0441\u0443\
    \u0448\u044B\u043B\u0430\u0440\u0434\u0430\u043D \u0436\u04D9\u043D\u0435 \u043E\
    \u043B\u0430\u0440\u0493\u0430 \u0436\u0430\u0437\u044B\u043F, \u043E\u049B\u0438\
    \ \u0430\u043B\u0430\u0434\u044B, \u0441\u043A\u0440\u0438\u043F\u0442\u0442\u0435\
    \u0440\u0434\u0456 \u0436\u04D9\u043D\u0435 \u049B\u043E\u043B\u0434\u0430\u043D\
    \u0431\u0430\u043B\u0430\u0440\u0434\u044B \u0436\u04E9\u043D\u0435\u043B\u0442\
    \u0435 \u0430\u043B\u0430\u0434\u044B. \u041E\u043D\u044B\u04A3 \u04AF\u0448 \u043A\
    \u04E9\u0440\u0456\u043D\u0456\u0441\u0456 \u0431\u0430\u0440: \u0442\u0430\u04A3\
    \u0431\u0430\u0448\u0430\u043B\u0430\u0440 \u0442\u043E\u0440\u044B, \u0442\u0430\
    \u04A3\u0431\u0430\u0448\u0430\u043B\u0430\u0440 \u0442\u0456\u0437\u0456\u043C\
    \u0456 \u0436\u04D9\u043D\u0435 \u0430\u0493\u0430\u0448 \u0442\u0435\u043A\u0442\
    \u0435\u0441 \u0442\u0456\u0437\u0456\u043C. \u041E\u043D\u044B\u04A3 \u043C\u04AF\
    \u043C\u043A\u0456\u043D\u0434\u0456\u043A\u0442\u0435\u0440\u0456\u043D \u043F\
    \u043B\u0430\u0433\u0438\u043D\u0434\u0435\u0440 \u0436\u04D9\u043D\u0435 \u0441\
    \u043A\u0440\u0438\u043F\u0442\u0442\u0435\u0440\u043C\u0435\u043D \u043A\u0435\
    \u04A3\u0435\u0439\u0442\u0443\u0433\u0435 \u0431\u043E\u043B\u0430\u0434\u044B\
    .</p>"
  nl: "<p>Bestanden, ook bekend onder de naam Nautilus, is het standaard bestandsbeheerprogramma\
    \ voor de GNOME-werkomgeving. Op een eenvoudige en ge\xEFntegreerde wijze kunt\
    \ u hiermee uw bestanden beheren en uw bestandssysteem verkennen.</p>\n<p>Nautilus\
    \ ondersteunt alle basisfuncties van een bestandsbeheerprogramma en meer. U kunt\
    \ uw bestanden en mappen doorzoeken en beheren, zowel lokaal als op een netwerk,\
    \ gegevens lezen van en schrijven naar verwijderbare media, scripts uitvoeren,\
    \ en toepassingen starten. Er zijn drie vormen van weergave: pictogrammenraster,\
    \ pictogrammenlijst en boomstructuurlijst. De functies kunnen uitgebreid worden\
    \ met plug-ins en scripts.</p>"
  zh_TW: "<p>\u300A\u6A94\u6848\u300B\u5373\u70BA\u300ANautilus\u300B\uFF0C\u662F\
    \ GNOME \u684C\u9762\u9810\u8A2D\u7684\u6A94\u6848\u7BA1\u7406\u5668\u3002\u63D0\
    \u4F9B\u60A8\u4E00\u7A2E\u7C21\u6613\u4E14\u5B8C\u6574\u7684\u65B9\u5F0F\u4F86\
    \u7BA1\u7406\u53CA\u700F\u89BD\u6A94\u6848\u7CFB\u7D71\u3002</p>\n<p>\u300A\u6A94\
    \u6848\u300B\u4E0D\u50C5\u652F\u63F4\u4E00\u5207\u57FA\u790E\u7684\u6A94\u6848\
    \u7BA1\u7406\u529F\u80FD\uFF0C\u4EA6\u652F\u63F4\uFF1A\u641C\u5C0B\u8207\u7BA1\
    \u7406\u60A8\u7684\u6A94\u6848\u8207\u8CC7\u6599\u593E\u3001\u9023\u63A5\u7DDA\
    \u4E0A\u4F4D\u7F6E\u8207\u9060\u7AEF\u4F3A\u670D\u5668\u3001\u8B80\u5BEB\u5378\
    \u9664\u5F0F\u5A92\u9AD4\u7684\u8CC7\u6599\u3001\u57F7\u884C\u547D\u4EE4\u7A3F\
    \u8207\u555F\u52D5\u61C9\u7528\u7A0B\u5F0F\u3002\u4E3B\u4ECB\u9762\u652F\u63F4\
    \u5169\u7A2E\u6AA2\u8996\u756B\u9762\uFF1A\u5716\u793A\u6AA2\u8996\u8207\u5217\
    \u8868\u6AA2\u8996\uFF1B\u4E26\u80FD\u900F\u904E\u5916\u639B\u5143\u4EF6\u8207\
    \u547D\u4EE4\u7A3F\u4F86\u5EF6\u4F38\u529F\u80FD\u3002</p>"
