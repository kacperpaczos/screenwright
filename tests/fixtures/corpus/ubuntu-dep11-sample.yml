    \u0433\u043B\u044F\u0434\u0430\u0442\u0438 \u0434\u0430\u043D\u0456 SMART, \u043A\
    \u0435\u0440\u0443\u0432\u0430\u0442\u0438 \u043F\u0440\u0438\u0441\u0442\u0440\
    \u043E\u044F\u043C\u0438, \u0432\u0438\u043F\u0440\u043E\u0431\u043E\u0432\u0443\
