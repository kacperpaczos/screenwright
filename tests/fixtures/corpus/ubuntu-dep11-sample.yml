    \u0441\u043A\u0438 \u0456 \u0437\u0430\u043F\u0438\u0441\u0443\u0432\u0430\u0442\
    \u0438 \u043E\u0431\u0440\u0430\u0437\u0438 \u043D\u0430 \u0444\u043B\u0435\u0448\
    \u043A\u0438 USB.</p>"
  C: "<p>\n      Disks provides an easy way to inspect, format, partition, and configure\
    \ disks\n      and block devices.\n    </p>\n<p>\n      Using Disks, you can view\
    \ SMART data, manage devices, benchmark physical\n      disks, and image USB sticks.\n\
    \    </p>"
  is: "<p>Diskar er einf\xF6ld lei\xF0 til a\xF0 sko\xF0a, forsn\xED\xF0a, snei\xF0\
    a og setja upp diska og blokkart\xE6ki.</p>\n<p>Me\xF0 \xFEv\xED a\xF0 nota Diskar-forriti\xF0\
    \ getur\xF0u sko\xF0a\xF0 SMART-g\xF6gn, s\xFDsla\xF0 me\xF0 t\xE6ki, afkastapr\xF3\
    fa\xF0 raundiska og skrifa\xF0 diskmyndir \xE1 USB-minnislykla.</p>"
  da: "<p>Diske g\xF8r det let at inspicere, formatere, partitionere og konfigurere\
    \ diske og blokenheder.</p>\n<p>Med Diske kan du se SMART-data, h\xE5ndtere enheder,\
    \ samt benchmarke fysiske diske og aftryk p\xE5 USB-n\xF8gler.</p>"
  lt: "<p>Diskai suteikia paprast\u0105 b\u016Bd\u0105 tikrinti, formatuoti, skaidyti\
    \ skaidiniai bei konfig\u016Bruoti diskus bei blokinius \u012Frenginius.</p>\n\
    <p>Naudodami diskus galite matyti SMART duomenis, tvarkyti RAID \u012Frenginius,\
    \ matuoti fizinius diskus bei kurti USB laikmen\u0173 atvaizd\u017Eius.</p>"
  sv: "<p>Diskar erbjuder ett enkelt s\xE4tt att inspektera, formatera, partitionera\
    \ samt konfigurera diskar och blockenheter.</p>\n<p>Med Diskar kan du se SMART-data,\
    \ hantera enheter, prestandatesta fysiska diskar och avbilds-USB-stickor.</p>"
  sk: "<p>Aplik\xE1cia Disky poskytuje jednoduch\xFD sp\xF4sob ako kontrolova\u0165\
    , form\xE1tova\u0165, deli\u0165 a konfigurova\u0165 disky a blokov\xE9 zariadenia.</p>\n\
    <p>V\u010Faka aplik\xE1cii Disky m\xF4\u017Eete prezera\u0165 \xFAdaje SMART,\
    \ spravova\u0165 zariadenia, odsk\xFA\u0161a\u0165 v\xFDkon fyzick\xFDch diskov\
    \ a vytv\xE1ra\u0165 obrazy USB k\u013E\xFA\u010Dov.</p>"
  ca: "<p>El Discs ofereix una forma senzilla d'inspeccionar, formatar, crear particions,\
    \ i configurar discs i dispositius de blocs.</p>\n<p>Amb el Discs, podeu veure\
    \ les dades SMART, gestionar dispositius, test de refer\xE8ncia dels discs i imatges\
    \ en llapis USB.</p>"
  fr: "<p>Disques propose une fa\xE7on simple d\u2019inspecter, de formater, partitionner\
    \ et configurer les disques et p\xE9riph\xE9riques en mode bloc.</p>\n<p>Disques\
    \ permet de consulter les donn\xE9es SMART, g\xE9rer des p\xE9riph\xE9riques,\
    \ tester des disques physiques et cr\xE9er des images sur des cl\xE9s USB.</p>"
  bg: "<p>\u041F\u0440\u043E\u0433\u0440\u0430\u043C\u0430\u0442\u0430 \u201E\u0414\
    \u0438\u0441\u043A\u043E\u0432\u0435 \u043D\u0430 GNOME\u201C \u0434\u0430\u0432\
