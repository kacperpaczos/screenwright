[project]
name = "screenwright"
version = "0.2.0"
description = "Headless screenshot capture and screenshot corpus/VM matrix tooling"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "screenwright contributors" }]
dependencies = [
    "httpx>=0.27,<1.0",
    "lxml>=5.2,<6.0",
    "jinja2>=3.1,<4.0",
    "pyyaml>=6.0,<7.0",
    "jsonschema>=4.21,<5.0",
    "requests>=2.31,<3.0",
    "opencv-python-headless>=4.9,<5.0",
    "pillow>=10.2,<11.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.14.2",
    "python-xlib>=0.33",
]

[project.optional-dependencies]
dev = [
    "types-PyYAML",
    "ruff==0.6.5",
    "mypy==1.11.2",
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "responses==0.26.2",
    "requests-mock==1.12.1",
    "import-linter==2.0",
    "pykickstart==3.52",
]

[project.urls]
Repository = "https://github.com/screenwright/screenwright"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["domains*", "shared*", "cli*", "vm*"]
exclude = ["tests*", "poc*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["domains", "shared", "cli", "tests"]
# Submoduły to cudzy kod referencyjny. Bez tego `ruff --fix` z korzenia
# przestawia w nich importy i brudzi 19 plików w trzech repozytoriach.
extend-exclude = ["discover", "gnome-software", "mintinstall", "poc"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "TCH", "PT"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
files = ["domains", "shared", "cli", "tests"]

[[tool.mypy.overrides]]
module = ["cv2.*", "lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=domains",
    "--cov=shared",
    "--cov=cli",
    "--cov=vm",
    "--cov-report=term-missing",
]
markers = [
    "unit: unit tests (fast, no I/O)",
    "integration: integration tests with mocked I/O",
    "slow: tests requiring external binaries (virt-install, qemu-img)",
    "architecture: domain boundary tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:lxml.*",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore::DeprecationWarning:starlette.*",
]

[tool.coverage.run]
branch = true
source = ["domains", "shared", "cli", "vm"]
omit = [
    "*/adapters/*",
    "*/distro_builders/elementary.py",
    "*/ports.py",
    "*/backend/virsh.py",
]

[tool.coverage.report]
fail_under = 50
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
show_missing = true