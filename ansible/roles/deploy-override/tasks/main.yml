---
# Wstrzykuje NASZ zrzut do prawdziwej dystrybucji tak, że sklep go RENDERUJE.
#
# Kluczowe (zweryfikowane na żywo 2026-08-22, GNOME Software 50, Fedora WS):
# libappstream UNIONuje listy <screenshots> komponentów o tym samym <id> z różnych
# katalogów, a merge="replace" jest ignorowany przez `appstreamcli refresh`. Osobny
# plik override (priority=1) tylko DODAJE nasz zrzut obok oryginału — sklep pokazuje
# bazowy pierwszy. Jedyne, co daje „tylko nasz", to podmiana bloku <screenshots>
# W SAMYM katalogu bazowym (`cli override --patch`). Dlatego: pobierz katalog z gościa,
# przepisz go naszym kodem na węźle sterującym, odeślij, odśwież, zweryfikuj.

- name: Katalog mediów w gościu
  ansible.builtin.file:
    path: "{{ override_media_dir }}"
    state: directory
    mode: "0755"
  become: true

- name: Wgraj obrazy override
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ override_media_dir }}/{{ item | basename }}"
    mode: "0644"
  become: true
  loop: "{{ override_media }}"

- name: Serwer mediów w gościu (systemd transient; URL-e w override wskazują na 127.0.0.1)
  ansible.builtin.command:
    cmd: >-
      systemd-run --unit=swmedia --collect --
      python3 -m http.server {{ override_media_port }} --directory {{ override_media_dir }}
  become: true
  register: swmedia
  changed_when: "'Running as unit' in (swmedia.stderr + swmedia.stdout)"
  failed_when: swmedia.rc != 0 and 'already exists' not in (swmedia.stderr | default(''))

- name: Kopia zapasowa katalogu bazowego (idempotentnie)
  ansible.builtin.copy:
    src: "{{ override_base_catalog }}"
    dest: "{{ override_base_catalog }}.screenwright-orig"
    remote_src: true
    force: false
    mode: "0644"
  become: true

- name: Pobierz katalog bazowy z gościa na węzeł sterujący
  ansible.builtin.fetch:
    src: "{{ override_base_catalog }}"
    dest: "{{ override_workdir }}/{{ inventory_hostname }}/base-catalog.xml.gz"
    flat: true

- name: Podmień <screenshots> komponentu w katalogu (naszym, przetestowanym kodem)
  ansible.builtin.command:
    cmd: >-
      python3 -m cli override --patch
      --id {{ override_component_id }}
      --base-url http://127.0.0.1:{{ override_media_port }}
      --prefix {{ override_prefix }}
      --catalog {{ override_workdir }}/{{ inventory_hostname }}/base-catalog.xml.gz
      --out {{ override_workdir }}/{{ inventory_hostname }}/patched-catalog.xml.gz
  delegate_to: localhost
  become: false
  args:
    chdir: "{{ screenwright_repo }}"
  changed_when: true

- name: Odeślij spatchowany katalog do gościa (podmiana w miejscu)
  ansible.builtin.copy:
    src: "{{ override_workdir }}/{{ inventory_hostname }}/patched-catalog.xml.gz"
    dest: "{{ override_base_catalog }}"
    mode: "0644"
  become: true

- name: Przebuduj cache AppStream
  ansible.builtin.command:
    cmd: appstreamcli refresh --force
  become: true
  changed_when: true

- name: Odczytaj metadane, które czyta sklep
  ansible.builtin.command:
    cmd: appstreamcli dump {{ override_component_id }}
  register: dump
  changed_when: false
  failed_when: false

- name: Nasz zrzut JEST w katalogu sklepu
  ansible.builtin.assert:
    that:
      - "('127.0.0.1:' ~ override_media_port ~ '/' ~ override_prefix ~ '-source.png') in dump.stdout"
    fail_msg: "override NIE trafił do katalogu sklepu — sprawdź patch i appstreamcli refresh"
    success_msg: "nasz zrzut widoczny dla sklepu ({{ override_component_id }})"

- name: To JEDYNY zrzut komponentu (podmiana, nie union z oryginałem)
  ansible.builtin.assert:
    that:
      - "(dump.stdout | regex_findall('<screenshot ') | length) == 1"
    fail_msg: >-
      komponent ma >1 <screenshot> — libappstream zunionował oryginał z naszym.
      Patch musi przepisać katalog bazowy w miejscu, nie dokładać osobnego pliku.
    success_msg: "komponent renderuje wyłącznie nasz zrzut"
