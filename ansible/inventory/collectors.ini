# Prowizjonowanie leci na localhost (host), zbieranie — na gościach przez passt.
[provision]
localhost ansible_connection=local

[collectors]
collector-fedora ansible_host=127.0.0.1 ansible_port=2201 distro=fedora
collector-ubuntu ansible_host=127.0.0.1 ansible_port=2202 distro=ubuntu

[collectors:vars]
ansible_user=test
ansible_python_interpreter=auto_silent
